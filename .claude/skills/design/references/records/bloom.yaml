# ── Extensions ────────────────────────────────────────────────────
x_invariants:
  style:
    - "The hero is the studio's own class under a half-transparent {colors.blush-veil} gradient from the left, words in {colors.plum}, a {colors.white} class card on the right."
    - "Grounds are {colors.white} and {colors.petal}; one {colors.rose} band; {colors.plum} footer."
    - "Instrument Serif for heads; Plus Jakarta Sans for reading."
  accessible:
    - "{colors.plum} on {colors.white} 15.2:1, on {colors.petal} 13.6:1, on {colors.blush-veil} 11.1:1; {colors.white} on {colors.primary} 9.0:1."
    - "Hero text sits only on the held 88% part of the veil (the left 45%); a hero video has a pause button and a poster and stops under reduced motion."
    - "Inputs 52px with visible labels; every control 48px or more."

x_imagery:
  role: >
    Real classes, real people, soft light. The hero shows a class in motion; bands below show the
    room, the teachers, the practice up close.
  density: "the hero always; a photograph beside most bands; the teachers as portraits"
  treatment: >
    Hero: a landscape video (720p+, muted, looping, inline, poster, pause button at the bottom
    right, no burned-in text) or the widest sharp photograph (1600px+), object-cover, full width,
    under a {colors.blush-veil} gradient at 88% held flat from the left edge to about 45% of
    the width, then to transparent by about 62% (from the bottom on a phone). A hosted player (Vimeo or YouTube)
    runs in the same frame with the utility `media-cover`, its thumbnail as the poster, paused
    through the provider's player API. Inside bands: photographs at {rounded.card}, 4/5 or 4/3,
    object-cover, no filter, no overlay.
  aspect_ratios: ["16/9", "4/5", "4/3", "1/1"]
  caption: >
    Optional, {typography.caption} {colors.plum-soft}, {spacing.step-sm} under a photograph: the class
    or the teacher, in the brief's words.
  forbidden:
    - "a pink tint over the whole photograph, or over the people moving"
    - "white text on the blush veil"
    - "a photograph enlarged past its own pixel width"
  no_assets_supplied: >
    With no class photograph or video, bloom is the wrong system.

x_emphasis:
  device: "the one figure in `text-figure` `text-plum` on a `bg-petal` band, its label in `text-label` `text-plum-soft` beneath, beside a photograph at 7/5"
  applies_to: "the one number the page leads with (years teaching, class size, a first-class offer), once"
  why: "One calm number reads as confidence; the serif keeps it soft."

x_motion:
  principle: "Everything moves as if breathing: slow, once, and never on its own."
  entrance: "On load the veil fades in over 1200ms, then the headline rises 16px and fades in 200ms later, then the class card rises 24px 400ms later, all ease-out."
  signature: "The hero video loops, muted; photographs in bands ease from 1.03 to 1.00 scale over 1600ms as they enter, once."
  scroll: "Only photographs settle as they enter; words do not animate on scroll."
  reduced: "Under prefers-reduced-motion the video shows its poster, nothing scales, nothing is hidden; with script off the page is complete."
  mechanism: "Tailwind transition, duration, ease, opacity, translate and scale utilities toggled by a short script (IntersectionObserver) with data-motion and data-delay attributes; the pause button toggles the video; no <style> block, no keyframes."

x_layout:
  measure:
    reading: "55–65ch in {typography.copy}"
    caption: "one line at the width of its photograph"
  grid:
    columns: 12
    container: "1200px, 48px side margins → 20px below 768px; the hero runs to the viewport edge"
    gutter: "32px"
    text_columns: "1–6 beside the card or a photograph; centred 3–10 for a closing ask"
    media_columns: "full viewport for the hero; 5–6 columns beside words; 4 in a row of three"
  rhythm:
    section: "{spacing.step-xl} → {spacing.step-lg}"
    group: "{spacing.step-lg} → {spacing.step-md}"
    item: "{spacing.step-md}"
    element: "{spacing.step-sm}"
