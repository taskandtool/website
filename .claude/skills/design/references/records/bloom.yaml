# Bloom: soft light. For wellness studios (yoga, pilates, barre, spas, breathwork), where the page
# should feel like the first deep breath of a class. The first screen is the studio's own class,
# a landscape video or photograph, under a half-transparent blush gradient that rises from the left
# and carries the words in deep plum; on the right, a white class card: the next classes and the
# way to book one. Below, white and petal-pink bands, a soft italic serif for the heads, rounded
# photographs. Light and airy where claret is a dark room. Built 2026-09-24 on Siesta Key Pilates
#.
id: bloom
title: Bloom
summary: >
  A wellness system: the studio's own class under a half-transparent blush gradient that carries
  the words in deep plum, a white class card beside it (the next classes and how to book), then
  white and petal-pink bands, a soft italic serif, rounded photographs. Light, calm, airy.
