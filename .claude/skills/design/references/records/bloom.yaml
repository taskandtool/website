    quote: { as: "grid", look: "on {colors.petal}: each a {colors.white} card at {rounded.card}, the platform's square mark and stars when the source gives them, the quote in {typography.title}, the name in {typography.caption} {colors.plum-soft}", counts: "1: one card on 3–10. 2: 6 + 6. 3: across. 4+: rows of 3." }
