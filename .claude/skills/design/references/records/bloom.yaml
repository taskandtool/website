sections:
  overview: >
    Bloom is soft light. The first screen is a real class, video or photograph, under a
    half-transparent {colors.blush-veil} gradient rising from the left edge and fading out past
    the middle; the headline sits on the pink in {colors.plum}, never in white. On the right, a
    {colors.white} class card at {rounded.card}: the next classes and the way to book. Below, the
    page alternates {colors.white} and {colors.petal}, with photographs at {rounded.card}, one
    {colors.rose} band where the page repeats its ask, and a {colors.plum} footer. Instrument
    Serif, an airy italic-leaning serif, carries the heads; Plus Jakarta Sans the rest.
  colors: >
    {colors.white} and {colors.petal} are the grounds (petal is a pale pink, never beige).
    {colors.plum} is all text (15.2:1 on white), {colors.plum-soft} secondary (8.1:1). The hero's
    gradient is {colors.blush-veil} at 88% held flat from the left edge to about 45% of the width
    (under all the words), then to transparent by about 62%; text sits only on the held part, where {colors.plum} holds 11:1,
    and all of it is {colors.plum}: the lead steps down by size, and {colors.plum-soft} stays on {colors.white} and {colors.petal}.
    {colors.primary}, a deep rose, is the brand's slot: buttons, with {colors.white} text (9.0:1).
    {colors.rose} is the one accent band. Text is never pink on pink and never white on blush.

    With the brand's own colour: the brand's colour fills the buttons; it must carry {colors.white} text at 4.5:1, so a deep brand colour (a plum, a teal, a forest green) works directly; a light brand colour keeps the rose and is used nowhere.
  typography: >
    Instrument Serif for every head: {typography.display} at 92px on the hero (two or three
    lines), {typography.heading-lg} at 48px for band heads, {typography.title} for class and
    card titles, {typography.figure} for the one number. Plus Jakarta Sans for reading at 18px,
    leads at 21px, labels at 16px, captions at 15px. Sentence case; the serif's italic may set one
    word of a headline, never a whole line.
  layout: >
    Twelve columns in a 1200px container with 32px gutters; the hero runs to the viewport edge.
    The hero is at least 720px tall: words on 1–6 on the veil, the class card on 8–12. Bands carry
    {spacing.step-xl} top and bottom; generous air is part of the calm.
  elevation_and_depth: >
    Flat. The class card is solid {colors.white} at {rounded.card} over the moving picture, and
    that contrast lifts it; no shadows anywhere.
  components: >
    {rounded.card} (28px) for photographs, the class card and cards; {rounded.soft} for inputs;
    {rounded.pill} for buttons and chips. The hero meets the edges square.

    Class card: {colors.white} at {rounded.card}, {spacing.step-md} padding; its title in
    {typography.title}; the next classes as rows (day and time in {typography.label}, the
    class name in {typography.copy}, the teacher in {typography.caption} {colors.plum-soft});
    the {colors.primary} pill to book; labelled inputs at {rounded.soft} only when the brief gives
    the form and where it sends. Primary button: {colors.primary} with {colors.white} text, a
    pill, 52px tall, hovering to {colors.primary-deep}.
  dos_and_donts:
    do:
      - rule: "Open on a real class: the studio's own landscape video (720p+, no burned-in text) or its widest sharp photograph (1600px+), people moving, the right half clear."
        why: "A wellness page sells how a class feels; the studio's own people in motion show it, and the right half stays clear for the card."
      - rule: "Carry the hero's words in {colors.plum} on a half-transparent {colors.blush-veil} gradient from the left, never white on pink."
        why: "The gradient is the system's softness; dark plum on blush holds contrast (11:1) where white would wash out."
      - rule: "Put the next classes and the way to book in the white card beside the hero."
        why: "A new student's first question is when, and the card answers it before they scroll."
    dont:
      - rule: "Don't tint the whole photograph pink, or run the gradient across the people moving."
        why: "The veil lifts the words; the class stays itself on the right."
      - rule: "Don't use a beige or cream ground."
        why: "The light grounds are white and a pale petal pink; warm off-white is the generated default."
      - rule: "Don't build a booking form without its real fields and where it sends."
        why: "A form that submits nowhere loses the student; without them the card's button goes to the studio's own booking page."
  responsive_behavior: >
    Below 768px the hero is about 75vh with the veil rising from the bottom instead of the left;
    the words sit on it in {typography.display-md}, and the class card follows beneath on
    {colors.petal}, full width. Bands go to one column with 20px margins; section padding
    {spacing.step-xl} → {spacing.step-lg}. The video plays muted and inline; under reduced motion it shows
    its poster.
  known_gaps: >
    No studio photograph or video with people in it: bloom is the wrong system. Class times change;
    the brief carries them only as the studio's own schedule states them, with their dates, or
    links to the schedule instead.

