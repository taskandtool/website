# The website's lint hints this system uses on purpose (scripts/lint.mjs).
x_declares: []

# ── Extensions ────────────────────────────────────────────────────
x_invariants:
  style:
    - "The counter: a {colors.white} panel on columns 2–11 over the photograph's lower edge, holding the headline and the top tasks; no words on the photograph."
    - "{colors.navy} header, footer and close; {colors.white} and {colors.mist} bands; {colors.marigold} only as a notice tag."
    - "Every news item, meeting and event is dated in full, as a row."
  accessible:
    - "{colors.ink} on {colors.white} 17.6:1, on {colors.mist} 15.7:1; {colors.white} on {colors.navy} 15.1:1; {colors.primary} on {colors.white} 12.2:1."
    - "Task links are 64px targets; every control 48px or more; input borders 3:1."
    - "No text on a photograph anywhere."

x_imagery:
  role: >
    The photograph shows the place the institution serves: its skyline, waterfront, main street,
    campus or building. It is the one picture on the first screen and says where you are.
    Photographs inside the page go with news items and parks or facilities, as small frames.
  density: "the head's photograph always; a small frame beside some dated rows and index entries"
  treatment: >
    Head: a landscape photograph 1440px wide or more, sharp, of the place (not a person, not an
    event flyer), with its subject in the upper two thirds, since the lower 200px sits under the
    counter. Full bleed at 21/9, object-cover, no filter or overlay. Inside: 3/2 frames at 4px
    corners beside rows or above index entries, never a graphic with words on it.
  aspect_ratios: ["21/9", "3/2", "4/3", "1/1"]
  caption: >
    Optional, {typography.caption} {colors.ink-soft}, {spacing.step-xs} under a photograph.
  forbidden:
    - "words on a photograph, or a scrim"
    - "a flyer, banner or graphic with text used as a photograph"
    - "a carousel"
  no_assets_supplied: >
    With no photograph of the place, the counter stands alone on a {colors.mist} band under the
    header, and inside photographs are left out.

x_emphasis:
  device: "a {colors.marigold} notice tag in `text-label` before one dated line in `text-title` `text-ink`, on a `bg-mist` strip directly under the counter"
  applies_to: "the one current notice the page must carry (a closure, an emergency, a deadline), once"
  why: "A public notice is the one thing a public body must not let a visitor miss, and one tag in one colour says so without alarm."

x_motion:
  principle: "Steady; nothing moves that a visitor would have to wait for."
  entrance: "On load the counter rises 16px and fades in over 400ms; the photograph and everything else are already there."
  signature: "On hover or focus a task link's arrow moves 4px right over 150ms."
  scroll: "Nothing arrives on scroll."
  reduced: "Under prefers-reduced-motion nothing moves and nothing is hidden; with script off the page is complete."
  mechanism: "Tailwind transition, duration, opacity and translate utilities toggled by a short script with data-motion attributes, and group-hover/group-focus-visible translate on the arrow; no <style> block, no keyframes."

x_layout:
  measure:
    reading: "60–70ch in {typography.copy}"
    caption: "one or two lines at the width of its photograph"
  grid:
    columns: 12
    container: "1240px, 48px side margins → 20px below 768px"
    gutter: "32px"
    text_columns: "1–8 for reading, with 9–12 for a sidebar of links or facts"
    media_columns: "the head's photograph full bleed; frames at 3–4 columns beside rows"
  rhythm:
    section: "{spacing.step-xl} → {spacing.step-lg}"
    group: "{spacing.step-lg} → {spacing.step-md}"
    item: "{spacing.step-md}"
    element: "{spacing.step-sm}"
    separator: "surface: bands alternate {colors.white} and {colors.mist}, the close is {colors.navy}; rows of dated data are divided by 1px {colors.line} rules, and nothing else is"
  registers:
    persuasion: { head: statement, type: "{typography.display} headline, {typography.heading-lg} band heads, {typography.lede} leads, {typography.copy} body", rhythm: "as rhythm" }
    retrieval: { head: plain, type: "{typography.section} title, {typography.title} group heads, {typography.copy} rows", rhythm: "one step denser: section {spacing.step-lg}; the rows or the answer start on the first screen" }
    reading: { head: plain, type: "{typography.section} title, {typography.copy} at measure.reading on 1–8, {typography.title} subheads", rhythm: "one column on 1–8 with a sidebar on 10–12 for related links and contact" }
  head:
    statement: "The {colors.navy} header bar, 72px: left, the body's logo if it is light or white, otherwise its name in {typography.title} Source Serif {colors.white} (a dark logo would vanish on navy); right, four to six links in {typography.label} {colors.white} (the site's own top navigation when the brief names none) and one {colors.white} outline button for the main online service. Beneath it, a landscape photograph of the place, full bleed at 21/9 (no taller than 620px): 1440px wide or more, sharp, the place itself (skyline, waterfront, main street, campus), its subject and horizon in the upper two thirds, since the lower 200px will sit under the counter; no person posed at camera, no flyer. Then the counter: a {colors.white} panel on columns 2–11 with 4px corners and a 1px {colors.line} border (no shadow), pulled up 200px over the photograph's lower edge, padded {spacing.step-lg}. In it: the headline in {typography.display} {colors.ink} on 1–8 of the panel (eight words or fewer), one {typography.lede} {colors.ink-soft} line, then the top tasks (6–8) as a grid of task links, three across from 1024px, two from 768px, each a verb-first phrase in {typography.task} {colors.primary} with an arrow, a {colors.line} rule under each. The words stay on the white counter, so the photograph needs no scrim. With no photograph: the counter alone on {colors.mist}, not overlapping."
    plain: "The {colors.navy} header bar, then a {colors.mist} band: a breadcrumb in {typography.caption}, the title in {typography.section} {colors.ink} on 1–8, one {typography.lede} {colors.ink-soft} line; the first band starts {spacing.step-lg} below."
  close: "A {colors.navy} band: the ask in {typography.heading-lg} {colors.white} on 1–7 (how to reach the body), the phone number in {typography.section} {colors.white} beneath it, and on 8–12 the building's address and hours as facts in {colors.white}; one {colors.white} outline button for email or the page where the brief says contact goes. {spacing.step-xl} padding; the {colors.navy} footer follows, divided from it by a 1px {colors.line} rule."
  shapes:
    items: { as: "grid", look: "each item's name in {typography.title} {colors.ink} as a link, a line in {typography.copy} {colors.ink-soft} beneath, no cards and no icons", counts: "2–3: across. 4: two by two. 5–6: rows of 3. 7+: an A–Z list in three columns, names only." }
    table: { as: "table", look: "a real <table>: header row in {typography.label} {colors.ink-soft}, rows in {typography.copy} divided by 1px {colors.line} rules, figures tabular and right-aligned", counts: "≤ 20 rows: one table on 1–12. More: grouped by heading." }
    facts: { as: "stack", look: "key in {typography.label} {colors.ink-soft}, value in {typography.lede} {colors.ink}; on {colors.navy} both in {colors.white}", counts: "1–4: one column. 5+: two columns." }
    qa: { as: "stack", look: "each question a <details> summary in {typography.title} with a plus that turns to minus, the answer in {typography.copy}; 1px {colors.line} rules between", counts: "any: one column on 1–8." }
    people: { as: "grid", look: "square portrait at 4px corners, the name in {typography.title}, the role in {typography.copy} {colors.ink-soft}, phone and email as links", counts: "1–3: across. 4+: rows of 4. With no portraits: names and roles in a two-column list." }
    sequence: { as: "stack of rows", look: "dated rows: the date in {typography.label} {colors.ink-soft} on 1–3 (the month and day, the year beside it), the title in {typography.title} {colors.ink} as a link on 4–12 with one line under it, 1px {colors.line} rules between; a row may carry a 3/2 frame on 10–12", counts: "≤ 6: one list. 7+: the first 6 with a 'View more' link." }
    media_text: { as: "sidebar", look: "a 3/2 photograph on 1–6 (or 7–12), the heading in {typography.heading-lg} and a passage on the other side", counts: "one per band; alternate sides when two follow each other" }
    gallery: { as: "grid", look: "3/2 frames at 4px corners, captions beneath in {typography.caption}", counts: "2: pair. 3: across. 4: two by two. 5+: rows of 3." }
    quote: { as: "stack", look: "the words in {typography.title} {colors.ink} on 1–8, the name and role in {typography.label} {colors.ink-soft}", counts: "1: alone. 2–3: across." }
    prose: { as: "center", look: "{typography.copy} at measure.reading on 1–8", counts: "—" }
    form: { as: "stack", look: "labels above inputs in {typography.label}, inputs 52px with a 1px {colors.line} border at 4px, the button beneath", counts: "≤ 6 fields in one column on 1–6. More: two columns on 1–8." }
    index: { as: "grid", look: "each entry a 3/2 frame (when the brief gives one), the title in {typography.title} as a link, one line beneath", counts: "2–3: across. 4: two by two. 5+: rows of 3." }
  focal: "The counter's tasks lead the page: what a visitor came to do is the first thing they can click. In each band after, the dated row or the named link leads; the photograph is where, not what."
  never:
    - "words on a photograph, or a scrim"
    - "a carousel or slider of banners"
    - "a beige or cream ground, or tinted text"
    - "marigold used as anything but a notice tag"
