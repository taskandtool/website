# Civic: the front desk. For public bodies (cities, counties, school districts, libraries, public
# utilities, universities' public faces): most visitors come to do one task, so the first screen is
# a wide photograph of the place with a white service counter laid over its lower edge, holding the
# headline and the top tasks as big verb-first links. Navy header and footer, white and cool mist
# bands, a marigold notice tag for dated notices, Source Serif 4 heads over Public Sans. Distinct
# from crest (dark fade, words on the picture) and open (video, white signup band under it). Built
# 2026-09-25 on the City of Sarasota.
id: civic
title: Civic
summary: >
  A public-body system: a wide photograph of the place with a white service counter laid over its
  lower edge (the headline and the top tasks as big verb-first links), navy header and footer,
  white and cool mist bands, dated notices with a marigold tag, Source Serif 4 over Public Sans.
tokens:
  colors:
    primary: "#16365F"
    primary-deep: "#0F2744"
    navy: "#0F2744"
    ink: "#15191F"
    ink-soft: "#4A5361"
    white: "#FFFFFF"
    mist: "#EEF2F6"
    marigold: "#F2B632"
    line: "#7D8896"
    # the website's colour roles (styles/input.css, the layout and the shared components read these)
    canvas: "{colors.white}"
    surface: "{colors.white}"
    panel: "{colors.mist}"
    night: "{colors.navy}"
    ink-2: "{colors.ink-soft}"
    ink-3: "{colors.ink-soft}"
    night-ink: "{colors.white}"
    night-ink-2: "{colors.mist}"
    accent: "{colors.primary}"
    accent-ink: "{colors.white}"
    accent-hover: "{colors.primary-deep}"
    line-strong: "{colors.line}"
    line-on-night: "rgb(255 255 255 / 0.16)"
  typography:
    display:
      fontFamily: "Source Serif 4"
      fontSize: 60px
      fontWeight: 600
      lineHeight: 1.05
      letterSpacing: -1px
    section:
      fontFamily: "Source Serif 4"
      fontSize: 46px
      fontWeight: 600
      lineHeight: 1.1
      letterSpacing: -0.6px
    heading-lg:
      fontFamily: "Source Serif 4"
      fontSize: 40px
      fontWeight: 600
      lineHeight: 1.15
      letterSpacing: -0.4px
    title:
      fontFamily: "Source Serif 4"
      fontSize: 26px
      fontWeight: 600
      lineHeight: 1.25
      letterSpacing: -0.1px
    task:
      fontFamily: "Public Sans"
      fontSize: 21px
      fontWeight: 600
      lineHeight: 1.3
      letterSpacing: 0px
    lede:
      fontFamily: "Public Sans"
      fontSize: 21px
      fontWeight: 400
      lineHeight: 1.55
      letterSpacing: 0px
    copy:
      fontFamily: "Public Sans"
      fontSize: 18px
      fontWeight: 400
      lineHeight: 1.6
      letterSpacing: 0px
    label:
      fontFamily: "Public Sans"
      fontSize: 16px
      fontWeight: 700
      lineHeight: 1.3
      letterSpacing: 0.2px
    caption:
      fontFamily: "Public Sans"
      fontSize: 15px
      fontWeight: 400
      lineHeight: 1.5
      letterSpacing: 0px
  rounded:
    none: 0px
    soft: 4px
    # the website's roles: control (pressed or typed) and card (containers)
    card: "{rounded.soft}"
    control: "{rounded.soft}"
  spacing:
    step-xs: 8px
    step-sm: 16px
    step-md: 32px
    step-lg: 64px
    step-xl: 104px
    step-xxl: 160px
    # the website's roles: between bands, and between groups inside a band
    section: "{spacing.step-xl}"
    block: "{spacing.step-lg}"
  containers:
    content: 1240px
    wide: "{containers.content}"
sections:
  overview: >
    Civic is a front desk. Under a {colors.navy} header, a wide photograph of the place runs full
    width, and a {colors.white} counter panel is laid over its lower edge: the headline in
    {typography.display} Source Serif and, beneath it, the top tasks as large links in
    {typography.task}, each starting with a verb and ending in an arrow. The words sit on the
    counter, never on the photograph. After it, bands alternate {colors.white} and {colors.mist};
    news, meetings and events are dated rows; a notice carries a {colors.marigold} tag; the page
    closes on a {colors.navy} band with the phone number and the building's address.
  colors: >
    {colors.white} and {colors.mist} (a cool pale grey-blue, never beige) are the grounds.
    {colors.ink} is all text (17.6:1 on white, 15.7:1 on mist), {colors.ink-soft} secondary (7.8:1,
    6.9:1). {colors.navy} is the header, the footer and the close, carrying {colors.white} text only
    (15.1:1); nothing tinted. {colors.primary} is the links, the task arrows and the button (12.2:1
    on white). {colors.marigold} is a fill for a notice tag with {colors.ink} text (9.7:1), never
    text itself. {colors.line} (3.6:1 on white) outlines inputs and divides rows of dated data.

    With the brand's own colour: the body's own colour (usually from its seal) goes in the links, task arrows and button; it must carry {colors.white} text at 4.5:1 and read on {colors.white} at 4.5:1, so a deep blue, green or maroon works; a light one keeps the navy.
  typography: >
    Source Serif 4 at 600 for heads: {typography.display} (60px) for the counter's headline, eight
    words or fewer; {typography.heading-lg} (40px) for band heads; {typography.title} (26px) for
    row titles and names. Public Sans carries everything a visitor acts on: {typography.task} (21px,
    600) for task links, {typography.copy} (18px) for reading, {typography.lede} for leads,
    {typography.label} for dates, tags and buttons, {typography.caption} for small print. Dates are
    set in full ("September 23, 2026"), with tabular figures. Sentence case everywhere.
  layout: >
    Twelve columns in a 1240px container with 32px gutters. The header is a {colors.navy} bar 72px
    tall. The photograph runs full bleed at 21/9 (no taller than 620px). The counter sits on columns
    2–11, pulled up over the photograph's lower edge by 200px. Bands carry {spacing.step-xl} top and
    bottom.
  elevation_and_depth: >
    Flat: no shadows (the stylesheet has none). The counter reads as in front of the photograph
    because it is white, overlaps the photograph's edge and carries a 1px {colors.line} border.
    Everything else is flat.
  components: >
    Corners are {rounded.soft} (4px) on the counter, buttons, inputs, tags and photographs. No pills,
    no circles except avatars.

    Task link: {typography.task} {colors.primary} with an arrow after it, a 64px tall target, a
    {colors.line} rule under each in the counter's grid; on hover the arrow moves 4px right and the
    text underlines. Notice tag: {typography.label} {colors.ink} on {colors.marigold}, 4px corners,
    reading "Notice" or the brief's word for it. Button: {colors.primary} with {colors.white} text,
    52px tall, 4px corners, hovering to {colors.primary-deep}. Inputs: 52px, visible labels above,
    a 1px {colors.line} border.
  dos_and_donts:
    do:
      - rule: "Open with the counter: a {colors.white} panel on columns 2–11, pulled up 200px over the photograph's lower edge, holding the headline and the top tasks."
        why: "People come to a public site to do something; the counter puts the tasks on the first screen, in front of the place they belong to."
      - rule: "Write every task link as a verb-first phrase in {typography.task} {colors.primary} with an arrow, on a 64px target."
        why: "The verb says what happens on the click, a column of verbs scans faster than nouns, and a 64px target works for every visitor on any device."
      - rule: "Date every news item, meeting and event in full (\"September 23, 2026\") with tabular figures."
        why: "A public body is judged on being current, and a full date cannot be misread by a visitor from another country or a screen reader."
      - rule: "Set dated items as rows divided by 1px {colors.line} rules, the date before the title."
        why: "Rows make a list scannable by date; because rows of data are the only place rules appear, a rule means 'this is a list'."
      - rule: "Close the page on the {colors.navy} band with the phone number in {typography.section} and the building's address and hours."
        why: "Many visitors end up needing a person; the number and the door are the public body's last and most useful answer."
    dont:
      - rule: "Don't set words on the photograph or lay a scrim over it."
        why: "The words sit on the white counter, so they stay readable over any photograph and any clear picture of the place works."
      - rule: "Don't use a carousel or slider of banners."
        why: "A slider of flyers is the default public-site hero and hides most of its slides; one clear photograph says where you are."
      - rule: "Don't use a flyer, banner or graphic with words in it as a photograph."
        why: "Words inside an image cannot be read aloud, translated or resized, and the picture's job is to show the place, not to announce."
      - rule: "Don't use {colors.marigold} for anything but a notice tag, and never as text."
        why: "Marigold means a notice; seen anywhere else it is a false alarm, and as text on white it fails contrast."
      - rule: "Don't tint the text or add a colour for decoration."
        why: "Navy is the institution's frame and the blue marks what you can click; text stays {colors.ink} or {colors.white} so it reads the same on every ground."
      - rule: "Don't give the counter or anything else a shadow."
        why: "The counter reads as in front because it is white, overlaps the photograph and carries a 1px border; a shadow would turn the front desk into a floating card."
  responsive_behavior: >
    Below 768px the photograph is 4/3 and the counter no longer overlaps: it follows the photograph
    as a {colors.white} band full width with 20px margins, the headline at {typography.section},
    the tasks in one column. Dated rows keep the date above the title. Section padding {spacing.step-xl}
    → {spacing.step-lg}.
  known_gaps: >
    A body with no photograph of its place falls back to the counter alone on {colors.mist}. No icon
    set: task links carry an arrow only. Seals and logos appear in the header as the brand supplies
    them, never redrawn.

# Component recipes, by part: not compiled into the theme; read them with sections.components.
