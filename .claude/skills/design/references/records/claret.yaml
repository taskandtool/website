x_declares: []

x_imagery:
  role: >
    The photographs are the lit objects in a dark room: one per band at most, set large.
    Food is shown as a plate (a circle); a building, a room or people as a soft rectangle;
    a single portrait may be a circle.
  density: "one photograph per band at most, except a row of plates (three or four); the head always carries one"
  treatment: >
    Plates: aspect-square, rounded-full, object-cover, object-center, on a {colors.wine}
    frame, at 5–6 columns in the head (crossing the band's lower edge by {spacing.lg}) and
    4 columns in a row. Other photographs: {rounded.soft} corners, object-cover, at their
    own ratio, at up to 7 columns. No overlay, no scrim, no filter, no border, no shadow.
    Never stretch a photograph under about 1000px wide across the full viewport.
  aspect_ratios: ["1/1", "4/3", "3/2"]
  caption: >
    Optional, {typography.caption} in the band's text colour, {spacing.sm} beneath the image,
    one line saying what is on the plate or in the frame, in the brief's words.
  forbidden:
    - "a photograph used as a full-bleed background behind text"
    - "a food photograph in a rectangle"
    - "two plates of different sizes side by side in a row"
    - "a stretched low-resolution photograph"
  no_assets_supplied: >
    With no photographs the page is set in type on the colour fields: the head's plate
    position is taken by the headline running wider (cols 1–11), and rows of plates become
    rows of dish names in {typography.heading-md}. Never an empty circle. The white cloth
    bands still alternate.

x_emphasis:
  device: "on the full-width `bg-primary` band, the count shown as the things counted: one `rounded-round` `bg-claret` disc per unit (a year, an award, a course), its label in `text-label` → `text-heading-md` `text-primary`, in one row across columns 1–12 beneath the heading, which says the number in words, with one line in `text-body-lg` saying who says so. A figure that is not a count of up to eight things (a price, a percentage, 40 years) is one numeral in `text-figure` `text-claret` above that line, never alone in a side column"
  applies_to: "the one figure the page leads on, once per page, when the page has one; a page with no figure and no statement (a contact page, a menu) has no blush band"
  why: "One colour block is the statement; five plates in a row are five awards counted at a glance, in the shape the whole system serves on. The source is said once, not under every figure on the page."

x_motion:
  principle: "One orchestrated entrance and one signature gesture. Nothing else moves, and no band fades in just because it scrolled into view."
  entrance: "On load, the head's words rise 24px and fade in over 1000ms ease-out, staggered 0, 150 and 300ms; the head's plate is set down 200ms later, from 90% scale, -12 degrees and transparent to rest."
  signature: "A plate turns 6 degrees on hover over 700ms ease-out, like a plate turned on the table to show it."
  scroll: "A row of plates arrives with the same set-down turn, 150ms apart; a list of names arrives one by one, 60ms apart; the one figure, or its row of discs, is set down like plates. No other band animates."
  reduced: "Under prefers-reduced-motion nothing moves and nothing is hidden; with script off the page is complete."
  mechanism: "The classes that hide an element are added by a short script only just before it is watched (IntersectionObserver), then removed; motion is Tailwind transition, duration, ease, opacity, translate, scale and rotate utilities (data-motion and data-delay attributes); hover uses motion-safe: variants. No <style> block, no keyframes."

