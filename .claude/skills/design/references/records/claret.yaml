# ── DESIGN.md prose sections (exported verbatim) ───────────────────
sections:
  overview: >
    Claret is one room lit for the evening. The head and about half the bands sit on
    {colors.claret}, a deep red-brown that makes food photography glow; {colors.cloth}, a
    plain white like a tablecloth, carries the bands between, with claret type, so the red
    reads as a choice and not a wall. {colors.claret-deep} carries the footer, and
    {colors.primary}, a blush pink, fills one colour-block band where the page makes its
    single statement. Type is cream on claret and claret on white; never a pink or tinted
    text on the red.
    Headlines are set very large in Gloock, a high-contrast display serif, and kept short;
    everything the reader reads is Albert Sans at 18px or more. The signature is the plate:
    a photograph of food is cropped to a circle and set large, and in the head it crosses
    the bottom edge of its band. There are no dividing rules, no numbered sections, no
    small tracked labels over headings and no source line under every figure; a change of
    ground is the only section break.
  colors: >
    Two rooms and one accent. {colors.claret} is the dark room: the head, the closing
    action and about half the bands, with {colors.claret-deep} for the footer.
    {colors.cloth} is the light room: the bands between, so no more than two dark bands
    ever run together. {colors.wine} fills panels, inputs and the ring behind a plate
    while its photograph loads. {colors.primary} (blush) is the accent: the primary button
    on dark, and one full-width colour-block band per page. Text is neutral against its
    ground: {colors.cream} on every dark ground, {colors.claret} on cloth and on blush.
    Secondary text steps down by size, never by tint, so no pink-grey or blush text on the
    red. {colors.line} is a rare hairline around inputs only, never text. Nothing is
    beige.
  typography: >
    Gloock carries every heading and the one figure: {typography.display-xl} at 120px for
    the head (56px from {typography.display-md} on a phone, where 80px leaves one word to a line), {typography.heading-lg} at
    52px for section heads, {typography.heading-md} at 32px for item names. Albert Sans
    carries the reading: {typography.body-lg} 22px for leads, {typography.body-md} 18px
    for body, {typography.label} 16px semibold for buttons and navigation in sentence
    case, {typography.caption} 15px for captions. Headlines stay under about eight words
    so they sit in two or three lines at display size. Nothing is set in tracked capitals.
  layout: >
    A 12-column grid in a 1280px container with 32px gutters, bands running full width.
    Section bands carry {spacing.xl} top and bottom (112px), the head more. Text columns
    sit on 1–6 or 7–12; a plate takes 5–6 columns. Bands alternate between the dark room
    ({colors.claret}) and the white cloth ({colors.cloth}), starting dark in the head and
    ending dark in the closing action and footer; the one blush band sits where the
    page's statement is and counts as neither. Every band holds one idea and one photograph at most, so the page stays
    sparse and each image is lit.
  elevation_and_depth: >
    Flat. No shadows, no blur, no gradients. Depth comes from the plate crossing a band's
    edge and from the change between the dark room, the white cloth and the blush band.
  shapes: >
    Three shapes. The circle ({rounded.round}) for plates, portraits and every button. A
    soft rectangle ({rounded.soft}) for panels, inputs and a non-food photograph such as
    a building or a room. Square corners ({rounded.none}) nowhere visible.
  components: >
    The primary button is a blush pill with claret text in {typography.label}, 56px tall,
    hovering to {colors.primary-deep}; on cloth the action is a claret pill with white
    text. The secondary button is a cream-outlined pill on claret, or a claret-outlined
    pill on cloth. Links are the band's text colour with a 1px underline. A plate is an img in an aspect-square,
    rounded-full frame on {colors.wine}, object-cover and centred on the food. A caption
    sits {spacing.sm} under its image in {typography.caption}, in the band's text colour. The
    figure is one number in {typography.figure} on the blush band. Inputs are wine
    panels with a cream label above.
  dos_and_donts:
    do:
      - rule: "Show a photograph of food as a plate: aspect-square, rounded-full, object-cover, at 5 or 6 columns in the head and 4 columns in a row."
        why: "The plate is round; a circle crop makes the photograph read as a dish on a table, and it is the one move no other system in the library makes."
      - rule: "Keep a headline to about eight words so it sets in two or three lines of {typography.display-xl}."
        why: "Large type only reads as confident when it is short; a sentence at 120px becomes a wall."
      - rule: "Spend {colors.primary} on at most one full-width band per page, where the page has a statement or a figure, and on the primary button, nowhere else."
        why: "One committed colour block is the page's statement; blush scattered in small pieces becomes decoration."
      - rule: "Set body text at {typography.body-md} (18px) or larger, and section heads at {typography.heading-lg} (52px)."
        why: "Small grey text and small section heads under a huge headline are what made the earlier library read as generated (research/34)."
    dont:
      - rule: "Don't put a thin rule, a number or a tracked-capital label above a heading."
        why: "The colour change already separates bands; rule-number-label chrome is the most common tell of generated pages."
      - rule: "Don't put a source or date line under every figure; gather attributions in one place when the brief carries them."
        why: "Scattered 13px provenance lines turn a page into a document; the one figure carries its source once, in its own band."
      - rule: "Don't run more than two dark bands in a row, and don't set pink, blush or pink-grey text on the red."
        why: "A page that is all red with red-tinted type reads heavy and muddy; the white cloth bands and neutral text are what let the claret read as a committed choice."
      - rule: "Don't use a beige or cream ground."
        why: "The light room is plain white like a tablecloth; beige is the generated default this library is leaving (research/34)."
      - rule: "Don't crop a building, a room or a person to a circle, except a single portrait."
        why: "The circle means a plate; spent on everything it means nothing."
  responsive_behavior: >
    Below 768px the grid is one column with 20px side margins. {typography.display-xl}
    steps to {typography.display-md} (56px, so eight words set in three or four lines with
    no short word stranded) and {typography.heading-lg} to
    {typography.heading-md}; body stays 18px. Band padding goes from {spacing.xl} to
    {spacing.lg}. The head's plate moves under the words, full width minus margins, and
    keeps crossing the band's lower edge by {spacing.lg}. Buttons are full width and 56px
    tall. Rows of plates become two across, then one below 480px.
  known_gaps: >
    No all-light theme exists; the white cloth is a band, never the whole page. Photography supplied below about
    1000px wide cannot run full-bleed on desktop; it is set as a plate or a soft rectangle
    at up to 6 columns instead. Gloock has one weight, so emphasis inside a heading comes
    from size, never bold. No icon set; a phone number is written out, not iconised.

