# Claret: a wine list after dark. The page is a deep claret room; the photographs are the
# lit plates on the table, and the white cloth is the relief between rooms. One committed
# colour (claret) with one bright note (blush), a high-contrast display serif set large and
# short, and one signature move: food is shown as a round plate (a circle), never a
# rectangle. Built from research/34: not beige, no
# numbered sections or eyebrow labels, body at 18px and section heads at 48px.
id: claret
title: Claret
summary: >
  A dark, committed-colour system for places people go in the evening: a deep claret
  ground with white cloth bands between, cream type on the dark and claret type on the
  white, one blush accent, a high-contrast display serif set large with
  short lines, and photographs of food shown as round plates. Nothing is beige and
  nothing is small.
description: >
  Claret is built around one room and one object. The room is the page: a single deep
  claret ground, darker for the footer, broken by white cloth bands so the red reads as a
  choice and not a wall, with a single blush colour block where the page makes its one
  statement. The object is the plate. Food photography is
  cropped to a circle and set large, often crossing the edge of a band, so dishes read as
  things on a table rather than pictures in boxes. Headlines are short and very large in
  Gloock; everything else is Albert Sans at a generous size. There are no rules between
  sections, no numbered labels and no captions under every figure: the colour change is
  the section break, and the page stays sparse so each photograph is lit. Suited to
  restaurants, wine bars, hotels at night, supper clubs, theatres and anything with a
  dining room, and to any brand whose best photographs are of one object at a time.

facets:
  kind: style
  vertical: [restaurant, bar, hospitality, evening]
  style_family: dark-colour-field
  mood: [rich, warm, confident]
  density: airy
  color_story: claret-cloth-blush
  motion_level: considered
  theme: [dark]
  complexity: 2

provenance:
  author: gavin
  license: MIT
  derived_from: null
  inspiration_note: >
    Original. Art direction drawn from lit-object-on-a-dark-stage product photography and
    single-colour-field templates (research/34 looked at Lovable's Soil & Spirit, Life
    Coach and Groundwork Coffee demos for the principle, not the look); reproduces no
    brand's identity.

