  head:
    statement: "A {colors.claret} band at least 760px tall. Left, columns 1–8 (about 780px at 1440): the headline in {typography.display-xl} {colors.cream}, in two or three lines, never a short word (four letters or fewer) stranded alone on a line; a long closing word alone is fine, a {typography.body-lg} {colors.cream} lead of one or two lines {spacing.md} below, then the primary blush pill and the phone number as a cream link on one row {spacing.lg} below. Right, columns 8–12: the words and the plate share column 8, so both sit on the first grid row and overlap there; the plate hangs from the band's bottom, so it clears the headline. It is one plate, about 480px, aspect-square rounded-full, whose bottom crosses into the next band by {spacing.lg}. The plate's source is one photograph of a single plated dish: landscape or square, at least 1024px wide and 680px on its shorter side (1000px or more is better, since the circle shows a square of the shorter side), shot from about 30–60 degrees above the table, the dish centred so the centre square crop holds it whole and fills about two-thirds of that square, on a plain dark or white plate and a quiet ground (table, cloth or slate); a fork or a glass may cross the edge, but no hands, faces, text or second dish; the circle is cropped object-center from it. With no food photograph the right holds the building or room as a {rounded.soft} rectangle, not crossing."
