sections:
  overview: >
    Crest shows the work first and large. The head is the work at full viewport width: a muted
    looping landscape video when the brand has a good one, otherwise its widest sharp
    photograph. A dark fade rises from the left edge ({colors.graphite} at 90% held flat across the words' columns, about 50% of the width,
    then to transparent by about 70%), and on it the headline and lead sit in {colors.white} and
    {colors.stone}. The right of the frame stays clear for a {colors.white} quote card holding
    the form or the action. Below, bands alternate {colors.graphite} and {colors.paper}, with wide
    photographs running edge to edge between them as breaks. Archivo carries everything, heavy
    and short in the heads. The brand's colour ({colors.primary}) fills the action and the
    checks, and nothing else is coloured, so the pictures carry the page.
  colors: >
    Two grounds and a card. {colors.graphite} is the dark ground: the head's fade, most bands, the
    footer. {colors.graphite-2} is a second dark band where two dark bands meet. {colors.paper} is the
    light relief band, a cool grey, never beige: it takes the bands that are read closely
    (reviews, facts, questions). {colors.white} is the quote card, inputs and cards on
    {colors.paper}. Text is neutral against its ground: {colors.paper} on dark with
    {colors.stone} for secondary lines, {colors.graphite} on light with {colors.slate}. Secondary
    text steps down by size and that one neutral step, never by tint. {colors.primary} fills
    the primary button under {colors.graphite} text and colours the check marks; it is the brand's
    slot. {colors.line} and {colors.line-dark} are hairlines inside a band only.

    With the brand's own colour: the brand's colour fills the action and the check marks; it must carry {colors.graphite} text at 4.5:1, so a light or bright brand colour works directly, and a dark one (a deep green, a navy) cannot fill the button. For a dark brand colour, keep the amber action and use the brand colour nowhere, or pick tally.
  typography: >
    Archivo throughout. {typography.display} at 88px for the head, stepping to
    {typography.section} at 64px between 768px and 1279px and {typography.display-md} at 44px
    below, set in two or three lines; {typography.heading-lg} at 48px for band heads; {typography.title} for card
    and feature titles; {typography.lede} for leads, {typography.copy} at 18px for reading,
    {typography.label} for buttons, nav, checks and form labels, {typography.caption} for
    captions and attributions. Headlines stay under about eight words. Sentence case everywhere.
  layout: >
    Twelve columns in a 1280px container with 32px gutters; media runs to the viewport edge.
    The head is a full-viewport-width band at least 760px tall on desktop: words on columns 1–7
    over the fade, the quote card on columns 8–12. A band that pairs words with a card or a
    photograph is a 7/5 or 6/6 split. Photo breaks run full width at 16/9 or 21/9, no text on
    them. Bands carry {spacing.step-xl} top and bottom.
  elevation_and_depth: >
    Flat. The quote card is solid {colors.white} at {rounded.card} over the media, and its
    contrast with the picture is enough to lift it; no shadows anywhere. Depth comes from the
    media and from the dark and light bands.
  components: >
    {rounded.card} (16px) for the quote card, cards and photographs inside a band;
    {rounded.control} (10px) for buttons and inputs; {rounded.none} for full-bleed media, which
    always meets the viewport edge square.

    Primary button: {colors.primary} with {colors.graphite} text in {typography.label}, 56px tall,
    hovering to {colors.primary-deep}. Secondary: {colors.graphite} with {colors.white} text, or a
    1px {colors.paper} outline on dark. Quote card: {colors.white}, {rounded.card}, {spacing.step-md}
    padding, its heading in {typography.title}, labelled inputs at 52px, the primary button
    full width, and what happens next in {typography.caption} {colors.slate} beneath. A check:
    a {colors.primary} tick beside {typography.label}, gloss beneath in the band's secondary
    colour. Review card: {colors.white} on {colors.paper}, the platform's mark in colour and the
    stars on one line, the quote, the name.
  dos_and_donts:
    do:
      - rule: "Open on the work at full viewport width: a muted, looping landscape video when the brand has one at 720p or better, otherwise its widest sharp photograph (at least 1600px wide)."
        why: "A premium service sells a result you can see; the first screen is the proof, and moving work reads as a firm that is busy and real."
      - rule: "Use the split head (words left, quote card right) on purpose: a premium service's reader decides and asks for a quote on the first screen, so the form belongs beside the promise; everything else about the head (the full-bleed work, the fade, the white card) is what makes it this system."
        why: "The split hero is a generated-page default when it is automatic; here it is declared because the landing guide puts the form beside the promise."
      - rule: "Carry the head's words on a dark fade from the left edge, white on {colors.graphite}, and keep the right of the frame clear for the quote card."
        why: "The fade makes the words readable over any picture without darkening the whole frame, so the work stays bright where the card sits."
      - rule: "Break the page with wide photographs edge to edge between bands, with no text on them."
        why: "The pictures are the page's evidence; a break every two or three bands keeps it visual without a gallery grid."
      - rule: "Alternate {colors.graphite} and {colors.paper} bands, and put the closely read bands (reviews, facts, questions) on {colors.paper}."
        why: "Dark reads premium but tires the eye; the light bands are relief, and platform marks and review text read best on light."
    dont:
      - rule: "Don't frost the quote card or put the whole frame under a scrim."
        why: "Frosted glass is vesper's device and the generated-page default; a full scrim greys the work the page exists to show."
      - rule: "Don't run a portrait or captioned social clip as the head video, or a photograph under about 1600px wide full-bleed."
        why: "A letterboxed or soft head is the first thing the reader sees and says the opposite of premium."
      - rule: "Don't use a beige or cream ground."
        why: "Warm off-white is the most crowded ground and the generated default; crest's light band is a cool grey."
  responsive_behavior: >
    Below 768px the head keeps the media full width at about 70vh with the fade rising from the
    bottom instead of the left; the words sit on it in {typography.display-md}, and the quote
    card follows directly beneath the media on {colors.graphite}, full width. Bands go to one column
    with 20px margins; section padding {spacing.step-xl} → {spacing.step-lg}. Photo breaks keep full width
    at 4/3. A head video still plays on a phone, muted and inline; under reduced motion it shows
    its poster frame.
  known_gaps: >
    A brand with no landscape video and no photograph at least 1600px wide cannot carry crest's
    head; use tally. Autoplaying video needs a visible pause control (WCAG 2.2.2), a poster
    frame, and a file under about 10MB. No icon set: checks are the one glyph.

