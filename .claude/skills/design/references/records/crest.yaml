# Crest: premium services. The work, seen large. A service business sells what it does to a place,
# and the best proof is a picture of it: so the page opens on the work at full width (a muted
# looping video when the brand has a good landscape one, otherwise its widest photograph), with a
# dark fade from the left that carries white words, and a white quote card on the right. Below,
# deep graphite bands alternate with light ones, and wide photographs run edge to edge between
# them. One strong grotesk, Archivo, set large and short. Built to the
# 2026-09-24 direction: full-bleed visuals, darker grounds where possible, lighter bands for
# contrast, a form beside the promise.
id: crest
title: Crest
summary: >
  A premium-services system: the hero is the work at full width (a looping video or the widest
  photograph) under a dark fade from the left that carries white words, with a white quote card
  on the right; deep graphite bands alternate with light ones, and wide photographs run edge to
  edge between them. One strong grotesk, set large and short.
