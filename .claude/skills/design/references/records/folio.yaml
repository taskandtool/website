    # the website's roles: control (pressed or typed) and card (containers)
    card: "{rounded.none}"
    control: "{rounded.none}"
  spacing:
    step-xs: 8px
    step-sm: 16px
    step-md: 24px
    step-lg: 48px
    step-xl: 80px
    step-xxl: 128px
    # the website's roles: between bands, and between groups inside a band
    section: "{spacing.step-xl}"
    lead: "{spacing.step-lg}"
  containers:
    content: 1280px
    wide: "{containers.content}"
sections:
  overview: >
    Folio is a front page. The nameplate (the publication's own logo, or its name in
    {typography.nameplate}) runs the width of the page over a dateline strip between two rules. The
    lead story's photograph sits large on columns 1–8 with its kicker, headline, standfirst and
    byline set beneath it; a rail of the latest stories runs down columns 9–12. After that, each
    section opens with a 3px {colors.ink} rule and a small-capitals label, and its stories run in
    columns divided by 1px {colors.rule} vertical rules. Kickers are {colors.red} capitals; everything
    else is black on pure white. A {colors.black} band closes the page with the subscription.
  colors: >
    {colors.white} is the page, pure and never warm. {colors.ink} is all text (18.9:1),
    {colors.ink-soft} datelines and bylines (8.5:1). {colors.red} is the one spot colour: kicker text
    (6.1:1 on white, 5.4:1 on newsprint) and the one button; nothing else is red. {colors.newsprint}
    (a cool pale grey) is one relief band, such as the most-read list. {colors.black} is the close
    and the footer, with {colors.white} text only (19.7:1). {colors.rule} (4.5:1) draws the column
    rules and outlines inputs.

    With the brand's own colour: the publication's own colour replaces the red (kickers and the button) when it reads at 4.5:1 on {colors.white} and carries {colors.white} text at 4.5:1: a deep red, blue or green; a light one keeps the red.
  typography: >
    Newsreader, a serif drawn for news, carries every headline and paragraph: {typography.display}
    (60px) for the lead headline, {typography.heading-lg} (30px) for a section's first story,
    {typography.title} (22px) for the rest, {typography.lede} for standfirsts,
    {typography.copy} for reading. IBM Plex Sans Condensed carries the newsroom's small type:
    {typography.kicker} (15px capitals, tracked) above each headline, {typography.caption} for
    datelines, bylines and captions, {typography.label} for the section labels and the button.
    Headlines in sentence or title case as the publication writes them, never all capitals; only
    kickers and section labels are capitals.
  layout: >
    Twelve columns in a 1280px container with 24px gutters, and a 1px {colors.rule} vertical rule
    in the middle of each gutter between story columns. Bands carry {spacing.step-xl} top and bottom; the
    front is dense on purpose.
  elevation_and_depth: >
    Flat, like paper. No shadows, no cards, no rounded corners: stories are separated by rules and
    space, never boxed.
  components: >
    Everything is square-cornered, photographs included.

    Story: kicker ({typography.kicker} {colors.red}), headline (Newsreader, linked, underlined on
    hover), optional standfirst ({typography.copy} {colors.ink-soft}), then the dateline and
    byline ({typography.caption} {colors.ink-soft}: "September 22, 2026 · By Name"). Section head: a
    3px {colors.ink} rule, then the label in {typography.label} capitals and a "More ›" link at the
    right end. Button: {colors.primary}, {colors.white} {typography.label}, square, 48px tall.
  dos_and_donts:
    do:
      - rule: "Lead with the most important story: its photograph large on columns 1–8 and its headline in {typography.display} set beneath it."
        why: "A front page's first job is to say what matters now; one story set larger than all the rest answers it before anything is read."
      - rule: "Run a rail of the latest stories on columns 9–12 beside the lead, each a kicker, a {typography.title} headline and a time."
        why: "A reader's second question is what's new; the rail answers it on the same screen without competing with the lead's size."
      - rule: "Give every story its date and byline in {typography.caption} {colors.ink-soft}."
        why: "The date says whether it is still news and the byline says who stands behind it; together they are the publication's credibility."
      - rule: "Divide story columns with 1px {colors.rule} vertical rules down the middle of the gutters."
        why: "Column rules are how a front page stays dense and orderly without boxing each story; the line does the separating that a card would."
      - rule: "Open every section with a 3px {colors.ink} rule and its label in {typography.label} capitals."
        why: "The thick rule is the section break on a page that never changes ground colour; it tells the reader a new department starts here."
      - rule: "Put a {typography.kicker} {colors.red} kicker above every headline."
        why: "The kickers are the only red on the page, so the eye steps kicker to headline, story by story, the way it scans a printed front."
    dont:
      - rule: "Don't set a headline or any text on a photograph."
        why: "News photography is shown as taken; with the headline beneath the picture it stays readable over any photograph, so any clear news picture works."
      - rule: "Don't box stories in cards or give anything a shadow."
        why: "Cards are the generated default, and a front page is flat paper: stories are separated by rules and space, and a box adds a surface the paper does not have."
      - rule: "Don't round a corner, photographs included."
        why: "Print is cut square; a rounded corner turns a news picture into an app tile."
      - rule: "Don't use warm cream paper."
        why: "Cream is the generated 'editorial' default and the old folio's mistake; this is newsprint-white."
      - rule: "Don't add a second accent colour or spend {colors.red} on anything but kickers and the one button."
        why: "Red is how a reader finds the next story; any other red or a second colour competes with the kickers and the page loses its scanning order."
      - rule: "Don't set headlines in all capitals."
        why: "Capitals belong to kickers and section labels; a capital headline erases the difference between the label and the story."
      - rule: "Don't print a date the brief does not give."
        why: "A static page's date goes stale, and a front page with an old date reads as abandoned."
  responsive_behavior: >
    Below 1024px the rail drops under the lead story; below 768px every column stacks, the vertical
    rules become 1px horizontal rules between stories, the lead headline is {typography.section},
    and the nameplate scales to fit the width. Section padding {spacing.step-xl} → {spacing.step-lg}.
  known_gaps: >
    A publication with no photographs sets the lead as type alone at {typography.display}. No
    icon set. The nameplate is the publication's own logo when it supplies one that reads on white.

