  head:
    statement: "The nameplate: the publication's own logo (dark, reading on white) centred, 56–72px tall with {spacing.step-md} above and below, or its name in {typography.nameplate} {colors.ink}; beneath it the dateline strip between two 1px {colors.ink} rules, one row 56px tall: the section names as links in {typography.label} capitals, spaced {spacing.step-md}, across the middle, and the subscribe button right. With more sections than fit one row, the date goes and the sections scroll sideways on narrow screens rather than wrap. No date is printed unless the brief gives one: a static page's date goes stale. Then the lead: on columns 1–8 a landscape news photograph (1080px wide or more, sharp, the story's own subject: a place seen from above, a person at work, a scene; no illustration, no screenshot) at 16/9, square-cornered, so the lead headline sits on the first screen at 1440×900; beneath it, {spacing.step-sm} below, the kicker in {typography.kicker} {colors.red}, the headline in {typography.display} {colors.ink} as a link, the standfirst in {typography.lede} {colors.ink-soft}, the dateline and byline in {typography.caption}. On columns 9–12, after a 1px vertical rule: the rail, its label ('Just published' or the publication's word) in {typography.label} capitals under a 3px rule, then four to six stories, each a kicker, a {typography.title} headline and a date or time, divided by 1px rules. No text on the photograph, so any clear news picture works. With no photograph: the lead is type alone on columns 1–8, opened by a 3px {colors.ink} rule {spacing.step-md} under the dateline strip: the kicker, the headline in {typography.display} {colors.ink} as a link, the standfirst in {typography.lede} {colors.ink-soft} and the dateline and byline, with the rail on 9–12 as before; no placeholder picture, no illustration, no tinted panel standing in for one."
    plain: "The nameplate and dateline strip, then a 3px {colors.ink} rule, the title in {typography.section} on 1–8 and one {typography.lede} {colors.ink-soft} line; the list starts {spacing.step-lg} below."
  close: "A {colors.black} band: the ask (subscribe, the newsletter) in {typography.section} {colors.white} on 1–7, one {typography.copy} {colors.white} line beneath, and on 9–12 the {colors.primary} button, or a labelled email field with the button when the brief gives where it sends; {spacing.step-xl} padding; the {colors.black} footer follows below a 1px {colors.rule} rule."
  shapes:
