  colors:
    primary: "#C4121F"
    primary-deep: "#9E0E18"
    red: "#C4121F"
    ink: "#111111"
    ink-soft: "#4D4D4D"
    white: "#FFFFFF"
    newsprint: "#F2F2F0"
    black: "#0B0B0B"
    rule: "#767676"
