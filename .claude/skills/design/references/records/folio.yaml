# Folio: the weekend edition. For publishers (city and regional magazines, newspapers, newsletters,
# any brand whose front page is a list of stories): a front page, not a feature. The nameplate runs
# the width of the page over a dateline strip; the lead story's photograph sits large with its
# headline set big BENEATH it, a "just published" rail beside it; below, stories in columns divided by
# thin vertical rules, every section opened by a thick rule and a small-capitals label, kickers in one
# newsroom red. Newsreader for every headline and paragraph, IBM Plex Sans Condensed for kickers,
# datelines and bylines. Pure white, never warm paper. Reworked 2026-09-25 on Sarasota Magazine
#.
id: folio
title: Folio
summary: >
  A publication system: a full-width nameplate over a dateline strip, a lead story with its big serif
  headline set beneath its photograph and a just-published rail beside it, stories in columns split by
  thin vertical rules, sections opened by a thick rule, red kickers; Newsreader and Plex Sans Condensed
  on pure white.
