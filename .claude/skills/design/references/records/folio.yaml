  entrance: "None: the page is there when it loads."
  signature: "On hover or focus a headline underlines and its photograph, if any, darkens 5%."
  scroll: "Nothing arrives on scroll."
  reduced: "Nothing moves in any case; hover changes remain."
  mechanism: "Tailwind hover and focus-visible utilities only; no script, no <style> block."

