    - "Every headline is a real link with a visible focus ring; controls 48px or more."
    - "No text on a photograph."

x_imagery:
  role: >
    News photography: each story's own picture, cropped to the frame the column gives it. The lead's
    photograph is the page's largest image and says what the lead story is about.
  density: "the lead always; a photograph on the first story of each section; the rest as type"
  treatment: >
    Lead: a landscape photograph 1080px wide or more (the lead runs about 850px wide), sharp, of the story's subject (a place, a
    person, a scene), set at 16/9 on columns 1–8, square-cornered, object-cover, no overlay. Section
    lead stories: 3/2 above the headline. Smaller stories: a 1/1 thumbnail at 96px beside the
    headline, or none. Captions and photo credits in {typography.caption} under the picture.
  aspect_ratios: ["3/2", "16/9", "4/3", "1/1"]
  caption: >
    Optional, {typography.caption} {colors.ink-soft}, with the photographer's credit when the
    publication gives one.
  forbidden:
    - "a headline or any text on a photograph"
    - "an AI-generated illustration or a screenshot standing in for news photography"
    - "rounded corners or a card shadow on a photograph"
  no_assets_supplied: >
    With no photographs, the lead is type: kicker, the headline at {typography.display} across
    columns 1–8, the standfirst beneath, and the rail beside it as before.

x_emphasis:
  device: "the lead story's headline in `text-display` beneath its photograph, with its kicker in `text-kicker` `text-red` above"
  applies_to: "the page's one lead story, once"
  why: "On a front page the lead is the emphasis: one story set larger than all the rest."

x_motion:
