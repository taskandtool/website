    quote: { as: "stack", look: "a pull quote in {typography.heading-lg} italic {colors.ink} between two 3px rules on 2–11, the speaker in {typography.caption} capitals", counts: "1: alone. 2–3: columns with vertical rules." }
    prose: { as: "center", look: "{typography.copy} at measure.reading on 3–10", counts: "—" }
