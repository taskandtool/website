# The website's lint hints this system uses on purpose (scripts/lint.mjs).
x_declares: []

# ── Extensions ────────────────────────────────────────────────────
x_invariants:
  style:
    - "The stage head: text on 1–6 on {colors.white}, the product in a {rounded.tile} tile on {colors.stage} on 7–12."
    - "Tiles and cards end in a {colors.primary} chevron link; figures are set in {typography.figure} on the one {colors.graphite} band."
    - "One family (Figtree), one accent ({colors.primary}), no shadows, no gradients, no words on photographs."
  accessible:
    - "{colors.ink} on {colors.white} 18.5:1; {colors.primary} on {colors.white} 6.4:1; {colors.white} on {colors.graphite} 16.9:1; {colors.ink-soft} on {colors.cloud} 7.3:1."
    - "Every control 48px or more; a whole tile is one link with a visible focus ring."
    - "No text on a photograph anywhere."

x_imagery:
  role: >
    The product leads: the stage shows what the company makes, close and sharp. The tiles show
    where it is used (markets, applications) or the companies it owns. People appear in a band about
    the company's people, not as decoration.
  density: "the stage always; a photograph in each tile; none in the figures band"
  treatment: >
    Stage: the company's own short product loop (a studio render, muted, looped, with its poster and
    a pause button), or a landscape or square photograph of the product, 1400px wide or more, sharp,
    the product filling most of the frame, cropped to fill the tile (object-cover) at 4/3 or 1/1; no
    people, no text, no filter. Tiles: 16/9 photographs at {rounded.tile} corners, object-cover. Marks: the
    brand's own award marks at 64px tall on {colors.white}, or on {colors.graphite} when the brand
    supplies a mark only in white.
  aspect_ratios: ["4/3", "1/1", "16/9", "3/2"]
  caption: >
    Optional, {typography.caption} {colors.ink-soft}, {spacing.step-xs} under a photograph.
  forbidden:
    - "words on a photograph, or a scrim"
    - "a stock handshake, laptop or skyline standing for the company"
    - "a gradient or glass effect"
  no_assets_supplied: >
    With no product photograph, the stage carries the best photograph of people at work; with no
    photographs at all, keystone is the wrong system.

x_emphasis:
  device: "the figures set in `text-figure` `text-white` on the `bg-graphite` band, each with a `text-copy` `text-white` label"
  applies_to: "the company's three or four stated figures (markets, countries, years, a record), once"
  why: "A keynote's one dark slide is where the numbers land; one band of weight on a bright page is what makes it serious."

x_motion:
  principle: "Composed and quick; nothing waits for animation."
  entrance: "On load the stage tile fades in and scales from 0.98 to 1 over 500ms; the text is already there."
  signature: "On hover or focus a tile's photograph scales to 1.03 inside its rounded frame over 300ms and its chevron moves 4px right."
  scroll: "Nothing arrives on scroll."
  reduced: "Under prefers-reduced-motion nothing moves and nothing is hidden; with script off the page is complete."
  mechanism: "Tailwind transition, duration, opacity, scale and translate utilities with group-hover/group-focus-visible on tiles and a short script with data-motion for the stage; no <style> block, no keyframes."

x_layout:
  measure:
    reading: "60–72ch in {typography.copy}"
    caption: "one or two lines at the width of its photograph"
  grid:
    columns: 12
    container: "1280px, 48px side margins → 20px below 768px"
    gutter: "32px"
    text_columns: "1–6 beside media, or 1–8 for reading"
    media_columns: "the stage on 7–12; tiles in thirds or quarters"
  rhythm:
    section: "{spacing.step-xl} → {spacing.step-lg}"
    group: "{spacing.step-lg} → {spacing.step-md}"
    item: "{spacing.step-md}"
    element: "{spacing.step-sm}"
    separator: "surface: {colors.white} bands with {colors.cloud} relief bands between, the one {colors.graphite} figures band after the tiles, the {colors.cloud} footer; never a rule between bands"
  registers:
    persuasion: { head: statement, type: "{typography.display} headline, {typography.heading-lg} band heads, {typography.lede} leads, {typography.copy} body", rhythm: "as rhythm" }
    retrieval: { head: plain, type: "{typography.section} title, {typography.title} group heads, {typography.copy} rows", rhythm: "one step denser: section {spacing.step-lg}; the rows or documents start on the first screen" }
    reading: { head: plain, type: "{typography.section} title, {typography.copy} at measure.reading on 1–8, {typography.title} subheads", rhythm: "one column on 1–8, related links on 10–12" }
  head:
    statement: "At least 640px tall on {colors.white}, under a {colors.white} header (the logo left, four to six links in {typography.label} {colors.ink}, one {colors.primary} button right; below 1024px the links move into a menu, a <details> element whose summary reads 'Menu' beside the button, so no link is lost on a phone). Columns 1–6, vertically centred: the headline in {typography.display} {colors.ink} (eight words or fewer; when it is two short sentences, each starts its own line, as a block span, so no line splices the end of one sentence to the start of the next), one {typography.lede} {colors.ink-soft} line, then the two actions side by side, {spacing.step-md} below: the {colors.primary} button (the page's action) and a chevron link (a second destination, such as the company's story). Columns 7–12: the stage, a {colors.stage} tile with {rounded.tile} corners, 560px tall or more, holding the product at object-cover so it fills the tile edge to edge (the media itself at {rounded.tile}). Best: the company's own short product loop (a studio render of the product assembling or turning, square or landscape, 1080px or more, on a plain light ground, silent or muted), playing muted, looped and inline with its own first frame as the poster and a pause button in the tile's corner; then a close, sharp product photograph, 1400px wide or more, no people, no words, its subject filling most of the frame. When the media's own ground is white, the tile is {colors.white} with a 1px {colors.cloud} edge instead of {colors.stage}, so no pale-blue seam shows around a white frame. The words never touch the photograph. Directly under the head, {spacing.step-lg} below: the accolade marks in one row (64px tall, {spacing.step-lg} apart), each with its name and year in {typography.caption} {colors.ink-soft}. A mark the brand supplies only in white goes on the {colors.graphite} figures band instead, beside the figures, with its name, year and any disclaimer the brand prints with it in {typography.caption} {colors.white}; with no dark mark left, there is no row under the head. With no product photograph: the best photograph of the company's people at work, in the same tile."
    plain: "A {colors.white} band: the title in {typography.section} {colors.ink} on 1–8, one {typography.lede} {colors.ink-soft} line; the first band starts {spacing.step-lg} below."
  close: "A {colors.stage} band at {rounded.tile} corners inside the container: the ask in {typography.heading-lg} {colors.ink} on 1–7, one {typography.lede} {colors.ink-soft} line, and on 9–12 the {colors.primary} button with a chevron link beneath it; {spacing.step-lg} padding; then the {colors.cloud} footer."
  shapes:
    items: { as: "grid", look: "tiles: a 16/9 photograph at {rounded.tile}, the name in {typography.title}, one line in {typography.copy} {colors.ink-soft}, a chevron link; with no photographs, the same on a {colors.cloud} tile at {rounded.tile} with {spacing.step-md} padding", counts: "2: halves. 3: thirds. 4: quarters from 1280px, halves below. 5–6: thirds. 7–8: quarters. 9+: thirds, titles and chevron links only." }
    table: { as: "table", look: "a real <table>: header row in {typography.label} {colors.ink-soft}, rows in {typography.copy}, divided by 1px {colors.cloud}-on-white rows (alternate rows filled {colors.cloud}); figures tabular and right-aligned", counts: "≤ 20 rows: one table. More: grouped by heading." }
    facts: { as: "grid", look: "on {colors.graphite}: each value in {typography.figure} {colors.white} on one line (never wrapped: a value too long for its column at 72px, such as \"8 million+\" in a third of eight columns, sets the whole row at {typography.section}), its label in {typography.copy} {colors.white} under it; on {colors.white}: value in {typography.title}, label in {typography.label} {colors.ink-soft}", counts: "2–4: across. 5–8: rows of 4." }
    qa: { as: "stack", look: "each question a <details> summary in {typography.title} with a chevron that turns, the answer in {typography.copy}; {colors.cloud} tiles at {rounded.button} with {spacing.step-sm} between", counts: "any: one column on 1–8." }
    people: { as: "grid", look: "portrait at 1/1 with {rounded.tile} corners, the name in {typography.title}, the role in {typography.copy} {colors.ink-soft}", counts: "1–4: across. 5+: rows of 4." }
    sequence: { as: "grid", look: "dated cards: a {colors.cloud} tile at {rounded.tile} with {spacing.step-md} padding, the date in {typography.label} {colors.ink-soft}, the title in {typography.title} as a link, a chevron link", counts: "3: thirds. 4: quarters. 5+: the first 4 and a 'View all ›' link." }
    media_text: { as: "sidebar", look: "a 4/3 photograph at {rounded.tile} on 7–12 (or 1–6), the heading in {typography.heading-lg}, a passage and a chevron link on the other side, vertically centred", counts: "one per band; alternate sides when two follow each other" }
    gallery: { as: "grid", look: "16/9 photographs at {rounded.tile}, captions beneath in {typography.caption}", counts: "2: halves. 3: thirds. 4: quarters. 5+: thirds." }
    quote: { as: "stack", look: "the words in {typography.heading-lg} {colors.ink} on 1–9, the name and role in {typography.label} {colors.ink-soft}; on a {colors.cloud} band", counts: "1: alone. 2–3: thirds as {colors.white} tiles at {rounded.tile} on the {colors.cloud} band. 4: two by two, the same tiles. 5–6: thirds, two rows." }
    prose: { as: "center", look: "{typography.copy} at measure.reading on 1–8", counts: "—" }
