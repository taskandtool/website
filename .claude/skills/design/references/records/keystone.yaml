# Keystone: the product keynote. For enterprises (industrial technology, B2B manufacturers, software
# and services companies, public companies with investors to speak to): serious, bright and
# orderly, like a big technology company's own site. The head is a stage: the headline and two
# actions on white at the left, the product in a large rounded tile on a pale blue stage at the
# right. Below: accolade marks in a quiet row, rounded image tiles with "Learn more ›" chevron
# links, a graphite band of big figures, and dated news cards. Figtree throughout. Distinct from
# civic (serif, navy bars, a counter over a photograph) and quiet (monochrome, no tiles). Built
# 2026-09-25 on Helios Technologies, Sarasota.
id: keystone
title: Keystone
summary: >
  An enterprise system: a split stage head (headline and two actions left on white, the product in
  a 24px-rounded tile on a pale blue stage right), a quiet row of accolade marks, rounded image
  tiles with chevron links, a graphite band of big figures, dated news cards; Figtree, one blue.
tokens:
  colors:
    primary: "#0B57D0"
    primary-deep: "#0842A0"
    ink: "#111418"
    ink-soft: "#4A5160"
    white: "#FFFFFF"
    stage: "#EAF1FB"
    cloud: "#F4F5F7"
    graphite: "#1A1D22"
    line: "#5F6673"
    # the website's colour roles (styles/input.css, the layout and the shared components read these)
    canvas: "{colors.white}"
    surface: "{colors.white}"
    panel: "{colors.cloud}"
    night: "{colors.graphite}"
    ink-2: "{colors.ink-soft}"
    ink-3: "{colors.ink-soft}"
    night-ink: "{colors.white}"
    night-ink-2: "{colors.cloud}"
    accent: "{colors.primary}"
    accent-ink: "{colors.white}"
    accent-hover: "{colors.primary-deep}"
    line-strong: "{colors.line}"
    line-on-night: "rgb(255 255 255 / 0.16)"
  typography:
    display:
      fontFamily: "Figtree"
      fontSize: 64px
      fontWeight: 600
      lineHeight: 1.05
      letterSpacing: -1.6px
    section:
      fontFamily: "Figtree"
      fontSize: 48px
      fontWeight: 600
      lineHeight: 1.1
      letterSpacing: -1px
    figure:
      fontFamily: "Figtree"
      fontSize: 72px
      fontWeight: 600
      lineHeight: 1.0
      letterSpacing: -2px
    heading-lg:
      fontFamily: "Figtree"
      fontSize: 44px
      fontWeight: 600
      lineHeight: 1.12
      letterSpacing: -0.8px
    title:
      fontFamily: "Figtree"
      fontSize: 24px
      fontWeight: 600
      lineHeight: 1.3
      letterSpacing: -0.2px
    lede:
      fontFamily: "Figtree"
      fontSize: 21px
      fontWeight: 400
      lineHeight: 1.55
      letterSpacing: 0px
    copy:
      fontFamily: "Figtree"
      fontSize: 18px
      fontWeight: 400
      lineHeight: 1.6
      letterSpacing: 0px
    label:
      fontFamily: "Figtree"
      fontSize: 16px
      fontWeight: 600
      lineHeight: 1.3
      letterSpacing: 0px
    caption:
      fontFamily: "Figtree"
      fontSize: 15px
      fontWeight: 400
      lineHeight: 1.5
      letterSpacing: 0px
  rounded:
    none: 0px
    button: 6px
    tile: 24px
    # the website's roles: control (pressed or typed) and card (containers)
    card: "{rounded.tile}"
    control: "{rounded.button}"
  spacing:
    step-xs: 8px
    step-sm: 16px
    step-md: 32px
    step-lg: 64px
    step-xl: 112px
    step-xxl: 160px
    # the website's roles: between bands, and between groups inside a band
    section: "{spacing.step-xl}"
    lead: "{spacing.step-lg}"
  containers:
    content: 1280px
    wide: "{containers.content}"
sections:
  overview: >
    Keystone is a keynote. The first screen is a stage: on {colors.white} at the left, the
    headline in {typography.display}, one {typography.lede} line and two actions (a
    {colors.primary} button and a "Learn more ›" chevron link); at the right, the product
    photographed close, in a tile with {rounded.tile} corners on a {colors.stage} ground. After
    it: a quiet row of accolade marks, rounded image tiles that each end in a chevron link, one
    {colors.graphite} band where the company's figures are set in {typography.figure}, dated news
    cards, and a {colors.cloud} footer. Everything is sans, orderly and bright.
  colors: >
    {colors.white} is the page. {colors.stage} (a pale blue) is the head's stage and the closing band, nothing else;
    {colors.cloud} is the tiles' fill, the relief bands and the footer. {colors.graphite} is the one
    dark band (the figures), carrying {colors.white} text only (16.9:1). {colors.ink} is all text
    (18.5:1 on white, 16.3:1 on stage), {colors.ink-soft} secondary (8.0:1, 7.0:1 on stage, 7.3:1
    on cloud). {colors.primary} is the button, the chevron links and focus (6.4:1 on white, 5.6:1 on
    stage), never a ground for a band. {colors.line} (5.8:1) outlines inputs only. Nothing tinted.

    With the brand's own colour: the company's own colour goes in the button and the chevron links; it must read at 4.5:1 on {colors.white} and carry {colors.white} text at 4.5:1, so a mid or deep blue, green, red or purple works; a light one keeps the blue.
  typography: >
    Figtree throughout, one family like a product company's system face. {typography.display}
    (64px, 600) for the head's headline, eight words or fewer; {typography.heading-lg} (44px) for
    band heads; {typography.title} (24px) for tile and card titles; {typography.figure} (72px)
    for the figures on graphite, each with a {typography.copy} label under it;
    {typography.copy} (18px) for reading, {typography.lede} for leads, {typography.label}
    for buttons, chevron links and dates, {typography.caption} for small print. Sentence case.
  layout: >
    Twelve columns in a 1280px container with 32px gutters. The head is at least 640px tall: text
    on columns 1–6, vertically centred; the stage tile on 7–12. Bands carry {spacing.step-xl} top and
    bottom.
  elevation_and_depth: >
    Flat: no shadows. Depth is the stage's pale blue behind the product and the tiles' rounded
    {colors.cloud} fills.
  components: >
    Media and tiles at {rounded.tile} (24px), buttons and inputs at {rounded.button} (6px). No
    circles and no pills.

    Primary button: {colors.primary} with {colors.white} {typography.label}, 52px tall, 6px corners,
    hovering to {colors.primary-deep}. Chevron link: {typography.label} {colors.primary} ending in
    "›" (a text character), underlined on hover; it is how every tile and card ends. Tile: a rounded
    photograph (16/9) above a title in {typography.title}, one line in {typography.copy}
    {colors.ink-soft}, and a chevron link; the whole tile is one link target. Accolade mark: the
    brand's own award or ranking mark, 64px tall, in its own colours, with a {typography.caption}
    line naming it and its year.
  dos_and_donts:
    do:
      - rule: "Put the product on the stage: the company's product loop or a close, sharp photograph of what it makes, filling the {rounded.tile} tile on {colors.stage} on columns 7–12."
        why: "An enterprise sells something real; showing the thing, lit like a keynote, says more than any abstract image."
      - rule: "Set the headline, one line and two actions on {colors.white} on columns 1–6: the {colors.primary} button and a 'Learn more ›' chevron link."
        why: "Enterprise buyers rarely decide on the first screen; one action for those ready and one for those still reading serves both without a third choice."
      - rule: "End every tile and card with a chevron link, and make the whole tile one link target."
        why: "Enterprise readers scan and click through; the chevron says where each tile leads, and a whole-tile target means no dead area to miss."
      - rule: "Set the company's figures in {typography.figure} on the one {colors.graphite} band."
        why: "A keynote's one dark slide is where the numbers land; a single band of weight on a bright page is what makes it serious."
      - rule: "Show accolades as one quiet row of the brand's own marks, 64px tall, each with its name and year in {typography.caption}."
        why: "A named, dated mark is proof a reader can check; held to one height in one row it reads as evidence, not a logo wall."
      - rule: "Use {rounded.tile} for media and tiles and {rounded.button} for buttons and inputs, and no other radius."
        why: "The big soft corner marks what you look at and the small one what you operate; a third radius blurs that difference."
    dont:
      - rule: "Don't use stock photographs of handshakes, laptops or skylines."
        why: "They are the generated enterprise default and say nothing about this company; the stage and tiles show what it makes and where it is used."
      - rule: "Don't set text on a photograph or lay a scrim over one."
        why: "Words sit on white or graphite here, which lets the product fill its tile edge to edge with nothing dimming it."
      - rule: "Don't add gradients or glass."
        why: "They are the generated technology-site default; the stage is a flat pale blue, and that flatness is what lights the product."
      - rule: "Don't add a second accent colour or use {colors.primary} as a band ground."
        why: "One blue means 'you can click this'; a blue band or a second colour would make the page louder and the links harder to find."
      - rule: "Don't use shadows."
        why: "Depth comes from the stage's pale blue and the tiles' {colors.cloud} fills; a shadow adds a third surface the system does not have."
      - rule: "Don't use pills or circles."
        why: "The rounded rectangle is keystone's one shape, the tile; a pill or circle reads as a consumer app, not a keynote."
  responsive_behavior: >
    Below 1024px the head stacks: text first, then the stage tile full width at 4/3. Tiles go two
    across, then one below 640px. Figures go two across, then one. Section padding {spacing.step-xl} →
    {spacing.step-lg}.
  known_gaps: >
    A company with no photograph of its product or work fills the stage with its best photograph of
    people at work, still in the rounded tile; with neither, keystone is the wrong system. No icon
    set.

