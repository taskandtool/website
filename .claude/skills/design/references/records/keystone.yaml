    index: { as: "grid", look: "logos or names of child companies or pages on {colors.cloud} tiles at {rounded.tile}, each with one line and a chevron link", counts: "2–4: across. 5–8: rows of 4. 9+: rows of 4, names only." }
  focal: "The stage's product leads the page. In each band after, the tile's photograph leads and the chevron link finishes it; the graphite figures band is the one moment of weight."
