sections:
  overview: >
    Open is an invitation. The first screen is the place in motion: the brand's own landscape
    video, muted and looping, full screen, with a short headline centred low in {colors.white} on
    a soft dark foot. At the fold the page turns {colors.white} and asks one thing: an oversized
    email field and a {colors.primary} button on one line, with the promise beside it. Below, a
    light page: what's on as dated rows with the day in {typography.date}, photographs of people
    there, {colors.cloud} bands for relief, one {colors.primary} band where the page repeats its
    ask. {colors.ink} closes the page in the footer.
  colors: >
    {colors.white} is the ground and {colors.cloud} the alternate band (cool, not beige).
    {colors.ink} is all text, with {colors.muted} for secondary lines (7.8:1). {colors.primary},
    a vivid coral, is the brand's slot: the button and the one accent band; it carries {colors.ink} text (6.5:1), never white. {colors.line} outlines the signup
    field. {colors.ink} with {colors.fog} is the footer. Text is neutral on every ground.

    With the brand's own colour: the brand's colour fills the button and the accent band; it must carry {colors.ink} text at 4.5:1, so a bright or light brand colour works (a teal, a coral, a yellow); a dark brand colour keeps the coral and is used nowhere.
  typography: >
    Bricolage Grotesque carries every head and every date: {typography.display} at 96px on the
    video (two lines, three at most), {typography.heading-lg} at 48px for band heads,
    {typography.title} for card and event titles, {typography.date} at 72px for the day of an
    event. DM Sans carries the reading at 18px, leads at 21px, labels at 16px, captions at 15px,
    and the signup field at 24px so it reads as the page's question. Sentence case.
  layout: >
    Twelve columns in a 1200px container with 32px gutters; the head's video and the accent band
    run to the viewport edge. The head is the full first screen (100vh, at least 640px). The
    signup band sits directly beneath it. Bands carry {spacing.step-xl} top and bottom.
  elevation_and_depth: >
    Flat. The video and the white band at the fold do the drama; cards are white on
    {colors.cloud} with no shadow.
  components: >
    {rounded.field} (a pill) for the signup field and every button: the ask is soft and
    friendly. {rounded.card} (20px) for photographs and cards inside a band. The head's video
    meets the edges square.

    Signup: one line, an oversized {colors.white} field at {rounded.field} with a 2px
    {colors.line} outline that turns {colors.ink} on focus, 72px tall, the email in
    {typography.field}; the {colors.primary} pill button beside it, same height; a visible label;
    what they'll get in {typography.copy} {colors.muted} beside or under it. Event row: the
    day in {typography.date}, the month in {typography.label} {colors.ink} above it, the
    event name in {typography.title} and its time and place in {typography.copy}
    {colors.muted}, on a 1px {colors.line} top rule.
  dos_and_donts:
    do:
      - rule: "Open on the place in motion: a muted, looping landscape video at 720p or better, full screen, with no text burned into it."
        why: "An invitation works when the reader sees the place full of people; titles burned into the video fight the headline."
      - rule: "Put the signup at the fold as its own white band, with what the reader gets beside it: one field and one button when the brief gives the form and where it sends, otherwise the button alone to the brand's own signup page."
        why: "Asking right where the video ends catches the reader at their most curious, and a single field is a yes that costs nothing."
      - rule: "Set event dates as the page's numerals, the day in {typography.date}."
        why: "The dates are the reason to come back; set large, they make the page read as alive."
    dont:
      - rule: "Don't put the form over the video, or frost it."
        why: "That is crest's and vesper's move; here the video stays clear and the page turns white to ask."
      - rule: "Don't set white text on {colors.primary}."
        why: "It fails contrast (2.85:1); the accent carries {colors.ink}."
      - rule: "Don't use a beige or cream ground."
        why: "The page is white and cool grey; warm off-white is the generated default."
  responsive_behavior: >
    Below 768px the head stays full screen with the headline in {typography.display-md}; the video
    plays muted and inline, and shows its poster under reduced motion. The signup stacks: the
    field full width, the button full width beneath it, both 64px tall. Event rows keep the big
    date at 56px to the left of the name. Bands go to one column with 20px margins; section
    padding {spacing.step-xl} → {spacing.step-lg}.
  known_gaps: >
    A brand with no clean landscape video uses its widest sharp photograph (1600px+) the same
    way; with neither, open is the wrong system. The signup needs its real fields and where it
    sends; without them it is a button to the brand's own signup page. No icon set.

