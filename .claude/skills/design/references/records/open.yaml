# Open: the open invitation. For places and events whose action is "join us" (a park, a venue, a
# festival, a launch, a community): the first screen is the brand's own landscape video, full
# screen, with a short headline; at the fold, a clean white band that is the signup itself, one
# oversized field and a button. Below, mostly white, with what's on as dated rows in big numerals
# and one bright accent. Bricolage Grotesque, friendly and loud in the heads. Built 2026-09-24 on
# The Bay Sarasota.
id: open
title: Open
summary: >
  An invitation system: a full-screen landscape video with a short headline, then a white band at
  the fold that is the signup itself (one oversized email field and a button), then a bright,
  mostly white page of what's on, with dates set in big numerals and one vivid accent.
tokens:
  colors:
    primary: "#FF6A3D"
    primary-deep: "#E5501F"
    ink: "#121417"
    muted: "#4D535C"
    white: "#FFFFFF"
    cloud: "#F3F4F2"
    line: "#DCDFE3"
    fog: "#B7BCC4"
