# Plinth is the still, light, classical arm of the library: where vesper is
# nocturnal and layered, plinth is ivory, flat and symmetrical. The whole
# argument is restraint — a museum object label, a title page, an engraved
# plate. Nothing floats, nothing glows, nothing is rounded except a seal.
id: plinth
title: Plinth
summary: >
  A neo-classical system: an ivory ground, one refined serif in a display cut
  and a text cut, hairline gold rules, and a centred, symmetrical composition.
  Every photograph is a plate in a frame; every label is an inscription.
tokens:
  colors:
    primary: "#6F5217"
    ivory: "#F8F4EA"
    stone: "#ECE5D3"
    marble: "#FFFDF7"
    ink: "#1F1B15"
    ink-soft: "#4B443A"
    ink-faint: "#6A6256"
    gold: "#C6A65A"
    # the website's colour roles (styles/input.css, the layout and the shared components read these)
    canvas: "{colors.ivory}"
    surface: "{colors.marble}"
    panel: "{colors.stone}"
    night: "{colors.ink}"
    ink-2: "{colors.ink-soft}"
    ink-3: "{colors.ink-faint}"
    night-ink: "{colors.ivory}"
    night-ink-2: "{colors.stone}"
    accent: "{colors.primary}"
    accent-ink: "{colors.ivory}"
    accent-hover: "{colors.ink}"
    line: "{colors.gold}"
    line-strong: "{colors.gold}"
    line-on-night: "{colors.gold}"
  typography:
    display:
      fontFamily: "Cormorant Garamond"
      fontSize: 76px
      fontWeight: 400
      lineHeight: 1.05
      letterSpacing: 0px
    section:
      fontFamily: "Cormorant Garamond"
      fontSize: 50px
      fontWeight: 400
      lineHeight: 1.1
      letterSpacing: 0px
    title:
      fontFamily: "Cormorant Garamond"
      fontSize: 32px
      fontWeight: 500
      lineHeight: 1.2
      letterSpacing: 0px
    lede:
      fontFamily: "EB Garamond"
      fontSize: 20px
      fontWeight: 400
      lineHeight: 1.6
      letterSpacing: 0px
    copy:
      fontFamily: "EB Garamond"
      fontSize: 18px
      fontWeight: 400
      lineHeight: 1.65
      letterSpacing: 0px
    display-phone:
      fontFamily: "Cormorant Garamond"
      fontSize: 44px
      fontWeight: 400
      lineHeight: 1.1
      letterSpacing: 0px
    figure-phone:
      fontFamily: "Cormorant Garamond"
      fontSize: 64px
      fontWeight: 400
      lineHeight: 1.0
      letterSpacing: -1px
      fontFeature: lnum
    figure:
      fontFamily: "Cormorant Garamond"
      fontSize: 96px
      fontWeight: 400
      lineHeight: 1.0
      letterSpacing: -1px
      fontFeature: lnum
    caption:
      fontFamily: "EB Garamond"
      fontSize: 15px
      fontWeight: 400
      lineHeight: 1.5
      letterSpacing: 0.2px
    label:
      fontFamily: "EB Garamond"
      fontSize: 12px
      fontWeight: 500
      lineHeight: 1.4
      letterSpacing: 2.4px
  rounded:
    square: 0px
    round: 9999px
    # the website's roles: control (pressed or typed) and card (containers)
    card: "{rounded.square}"
    control: "{rounded.round}"
  spacing:
    step-xs: 4px
    step-sm: 8px
    step-md: 16px
    step-lg: 32px
    step-xl: 64px
    step-xxl: 128px
    # the website's roles: between bands, and between groups inside a band
    section: "{spacing.step-xxl}"
    block: "{spacing.step-xl}"
  containers:
    content: 1120px
    wide: "{containers.content}"
sections:
  overview: >
    Plinth reads as a printed catalogue laid open on a table. The ground is
    {colors.ivory}; a second ground, {colors.stone}, marks a band in a changed
    register and the footer, the way a catalogue changes paper stock for
    its plates. Everything is centred on one axis. Sections are separated by a
    gold hairline in {colors.gold} with a small lozenge at its midpoint, never
    by whitespace alone and never by a card. Type is one Garamond model in two
    cuts: Cormorant Garamond for display and figures, EB Garamond for prose and
    labels. Photographs are plates: each sits inside a {colors.gold} hairline
    frame with an ivory mat and carries a numbered caption in
    {typography.caption}. Gold is never a text colour. Text-safe gold is the
    bronze {colors.primary}, and it is spent on links and the one primary
    action. Nothing casts a shadow, nothing blurs, nothing is rounded except
    the circular seal.
  colors: >
    Three light grounds and one ink. {colors.ivory} is the page.
    {colors.stone} is the alternate ground for a change of register, table
    headers and the footer. {colors.marble} is whiter than the page and is used only for
    input fields, so a field reads as a recessed panel of a paler stone.
    {colors.ink} is the universal text colour, a warm sepia-black rather than
    a tinted grey; {colors.ink-soft} carries secondary prose and inscriptions;
    {colors.ink-faint} carries captions and table headers and is the lightest
    text permitted anywhere (5.47:1 on ivory, 4.78:1 on stone).
    {colors.gold} is a hairline and a seal fill, at 2.12:1 on ivory it can
    never be text. {colors.primary} is the bronze that answers the gold-on-
    ivory trap: it is gold darkened until it clears 6.6:1, and it fills the
    primary button and colours links.

    With the brand's own colour: a brand colour replaces the bronze on links and the one button, so it must clear 4.5:1 as text on {colors.ivory} and {colors.stone} and hold {colors.ivory} text; {colors.gold} stays the hairline and seal, and the hover stays {colors.ink}.
  typography: >
    One Garamond model, two optical cuts, no sans anywhere. Cormorant Garamond
    at 400 sets {typography.display}, {typography.section} and
    {typography.figure}; at 500 it sets {typography.title}. EB Garamond
    at 400 sets {typography.lede}, {typography.copy} and
    {typography.caption}; at 500 with 2.4px tracking it sets
    {typography.label}, which is always rendered in capitals and is the only
    letterspaced style. Display sizes take no negative tracking: a classical
    title page is set open, and tight display tracking is the surest way to
    make this read as contemporary. Prose measure stays between 55 and 70
    characters. Italic is permitted for a single emphasised phrase or a quote,
    never for whole paragraphs.
  layout: >
    One centred column of at most 1120px with 24px side margins, inside which
    a twelve-column grid places plates symmetrically: a plate is 12 columns
    wide, or 8 columns starting at column 3, or two plates of 6, never off-
    centre. Headings, subheads, figures and buttons are centred on the page
    axis. Prose sits in a centred column of 640px and is left-aligned inside
    it. Sections are separated by the lozenge rule: a hairline in
    {colors.gold} broken at its midpoint by a rotated 8px square. The page
    alternates {colors.ivory} and {colors.stone} grounds only where the content
    changes register, not on every section. The hero is a centred title-page
    stack on the page axis. When the brief gives a short line to stand above
    the headline, it is set as the inscription line in {typography.label}
    capitals; otherwise the stack has none.
  elevation_and_depth: >
    There is none. No box-shadow, no backdrop blur, no gradient, no overlay on
    a photograph. Depth is expressed by exactly one device: the frame. An
    element that needs to read as an object gets a {colors.gold} hairline
    border and an ivory mat, the way a plate does. A second ground in
    {colors.stone} marks a change of register, not a change of height.
  components: >
    Two radii only. {rounded.square} (0px) for every surface, button, input,
    table and image. {rounded.round} (9999px) for the seal alone, which is the
    only circular object in the system and appears at most once per page.
    Lozenges are squares rotated 45 degrees, not diamonds drawn as shapes.

    Buttons are square-cornered rectangles set in {typography.label} capitals
    with generous horizontal padding. Primary is a {colors.primary} fill with
    {colors.ivory} text; on hover it deepens to {colors.ink}, so the change
    reads as a press rather than a glow. Secondary is {colors.ivory} with a one-
    pixel {colors.ink} border and {colors.ink} text. Links are
    {colors.primary} with a one-pixel {colors.gold} underline offset 4px.
    Inputs are {colors.marble} with a one-pixel {colors.gold} border on all
    sides and a visible label in {typography.label} above. Tables are
    catalogue tables: a {colors.stone} header row in {typography.label},
    {colors.gold} hairlines between rows, no vertical rules, no zebra
    striping. Quotes sit on {colors.stone} in {typography.lede} italic,
    centred, with the attribution in {typography.label} below. The seal is a
    64px {colors.gold} circle carrying {typography.label} in {colors.ink}.
  dos_and_donts:
    do:
      - rule: "Centre every heading, figure and action on the page axis, and place every plate symmetrically within the twelve-column grid."
        why: "Symmetry is the identity. One off-centre element makes the whole page read as an editorial layout that happens to use a serif."
      - rule: "Frame every photograph with a {colors.gold} hairline and an ivory mat, and number it beneath as a plate."
        why: "The frame is the only depth device the system has; an unframed image reads as a web hero, a framed one reads as a catalogue plate."
      - rule: "Separate sections with the lozenge rule in {colors.gold}, and change to {colors.stone} only where the register changes."
        why: "The rule is the structure. Whitespace alone lets the page read as a generic stack; a stone band on every section turns the grounds into stripes."
      - rule: "Set every label, button, table header and attribution in {typography.label} capitals."
        why: "Letterspaced capitals are the inscription: they are how a plinth names the object it carries. Keeping them small and rare is what keeps them classical."
      - rule: "Use {colors.primary} for links and the primary button, and {colors.gold} only for hairlines and the seal."
        why: "Gold at 2.12:1 fails as text on ivory; bronze is gold made legible. Splitting the two by role keeps the page both gold and readable."
    dont:
      - rule: "Don't set text in {colors.gold}, at any size."
        why: "It measures 2.12:1 on ivory and 1.86:1 on stone. Gold text is the obvious luxury move and the obvious accessibility failure; the bronze exists so it never has to happen."
      - rule: "Don't apply a box-shadow, a backdrop blur, a gradient or a scrim anywhere."
        why: "Each is a third surface the system does not have. Plinth is flat by construction; one shadow turns a catalogue page into a card layout."
      - rule: "Don't round a corner on anything but the seal."
        why: "A 4px radius on a button is the default every generated page reaches for. Square corners are what make the button read as a printed rule rather than a UI control."
      - rule: "Don't track display type negatively or set headings in capitals."
        why: "Tight tracking is the contemporary tell; capitals at display size shout. A classical title is set in upper-and-lower case at its natural spacing."
      - rule: "Don't introduce a sans-serif, a third weight of either cut, or a second accent colour."
        why: "The restraint is the message. Every addition is a variable the reader must resolve, and the system's calm comes from having almost none."
      - rule: "Don't put text over a photograph, or crop a plate to a shape."
        why: "A plate is looked at, not read through. Overlaid text turns it into a web hero and breaks the frame that gives the image its status."
  responsive_behavior: >
    Below 768px the twelve-column grid collapses to one column and every plate
    becomes full width, keeping its frame and mat at half the padding.
    {typography.display} drops to {typography.display-phone} (44px) and
    {typography.figure} to {typography.figure-phone} (64px);
    tracking stays at zero. Section spacing goes from {spacing.step-xxl} to
    {spacing.step-xl}. The lozenge rule and the centred axis are retained: they are
    the structure. Tables keep their columns and scroll horizontally rather
    than collapsing into cards. Tap targets are never below 44px.
  known_gaps: >
    No dark theme is defined and none should be invented; the system's
    identity is its light ground. No chart or data-visualisation palette is
    defined beyond {colors.ink} and {colors.gold}. Small capitals are
    approximated with tracked full capitals in {typography.label} because
    Google Fonts serves neither cut with a small-cap feature. Cormorant
    Garamond and EB Garamond are both on Google Fonts; no fallback is specified
    beyond a generic serif. Motion is undefined apart from the button hover,
    which is a colour change at 180ms.

