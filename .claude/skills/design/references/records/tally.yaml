      counts: "1: media_text. 2: 6 + 6. 3: 4 × 3. 4: 3 × 4 from 1024px, 2 × 2 below. 5: 3, then 2 at 6 + 6. 6: 3 × 2. 7+: rows of 4, a short last row set left. Name cells without portraits: 4 across from 768px, 2 below."
    sequence:
      as: "a grid of numbered steps"
      look: "the number in {typography.tally} {colors.ink} with tabular numerals, the step name in {typography.label}, its line in {typography.copy} {colors.ink-muted}; no connecting lines or arrows"
      counts: "2–3: across 12, one per column. 4: 2 × 2 beside a 5-column card, or 4 across 12. 5–6: 3 across, two rows. 7+ or dated entries: one column, each on a 1px {colors.line} top rule, the number or date at the left in {typography.heading-lg}."
    media_text:
      as: "sidebar"
      look: "a photograph at {rounded.card} beside a heading in {typography.heading-lg} and checked lines or a short passage; the caption under the photograph in {typography.caption} {colors.ink-muted}"
      counts: "1: photograph 5 and text 7, or text 7 and photograph 5. 2 in one band: side by side at 6 + 6, each a photograph in 2 of 5 columns with its text in 3 (stacked below 640px). 3+: set as items with photographs."
    gallery:
      as: "a 2- or 3-up grid"
      look: "each photograph at {rounded.card}, 4/3 (16/9 below 640px), its caption beneath in {typography.caption} {colors.ink-muted}"
      counts: "1: one wide photograph across 8–12. 2: 2-up. 3: 3-up. 4: 2 × 2, never 3 + 1. 5: 3, then 2-up. 6: 3 × 2. 7: 3, then 2-up twice. 8: 3, 3, then 2-up. 9+: rows of 3; a remainder of 1 turns the last two rows into 2-up rows, a remainder of 2 closes on one 2-up row. Never 4 across, never a lone orphan."
    quote:
      as: "a grid of review cards on a {colors.panel} band"
      look: "each card {colors.canvas} at {rounded.card}, {spacing.step-md} padding: the platform's square mark in colour (24px) and the review's stars as star graphics (/images/platforms/star.svg, 18px each) on one line when the source gives a rating, the quotation in {typography.copy} {colors.ink}, the attribution and date in {typography.caption} {colors.ink-muted}. A review that came with the customer's photograph carries it at the top of its card, 4/3 at {rounded.card}, full card width"
      counts: "1: one card across 8, beside a figure cell (a count or rating in {typography.tally}) only when the brief gives that figure. 2: two cards at 6 + 6, or 4 + 4 + a figure card when the brief gives the figure. 3: 3-up. 4: 2 × 2. 5: 3, then 2-up. 6: 3 × 2. 7+: rows of 3, under the band's lead line in {typography.lede} {colors.ink-muted} (a count there only when the brief states it)."
    prose:
      as: "stack at measure.reading"
      look: "{typography.copy} {colors.ink}, supporting lines in {colors.ink-muted}, subheads in {typography.title}; a run of claims inside the text is broken out as checked lines"
      counts: "1–3 paragraphs: the left 7 of a band, a card or photograph beside. Longer: registers.reading."
    form:
      as: "a card; stepped when it asks choices"
      look: "a {colors.canvas} card at {rounded.card} with a 1px {colors.line} border and {spacing.step-md}–{spacing.step-lg} padding. Stepped: 'Step n of m' in {typography.caption} {colors.ink-muted} over a {colors.line} progress track with a {colors.primary} fill, one question per step in {typography.heading-sm}, answers as {colors.panel} tiles at {rounded.tight}, 2-up, 56px tall, in {typography.label}; a tap advances; Back is a text button. Text fields: a label in {typography.label} above, the input {colors.canvas} with a 1px {colors.line} border at {rounded.tight}, 48px tall. The submit is button-primary, full width, 56px tall; a reassurance line in {typography.caption} {colors.ink-muted} centred beneath."
      counts: "1–3 fields: one step, no track. 4+ fields with choices: stepped — choices first, one per step, the text fields together on the last step. 2–4 choices: 2-up tiles; 5–6: 2-up in three rows; 7+: a select. Placement: the right 5 of a 7/5 split, sticky beside a long list; alone, 6 columns; below 768px full width, following the text."
    index:
      as: "a grid of rows or cards"
      look: "the title as the link in {typography.heading-sm} {colors.ink}, one line in {typography.copy} {colors.ink-muted}, a date in {typography.caption}; each on a 1px {colors.line} top rule, or as a {colors.canvas} card at {rounded.card} with its photograph when entries have one"
      counts: "1–6: one column of rows in 7. 7–20: two columns of rows. With photographs: 3-up cards, the gallery's remainder rules. 20+: rows grouped under {typography.heading-sm} heads."
  close: "The one {colors.night} band: a 7/5 split, the heading in {typography.section} {colors.canvas} and one {typography.lede} {colors.night-muted} line on the left 7, and on the right 5 the action again as the page gives it (the form card itself, never a button back to the top), {colors.canvas} card at {rounded.card}. The footer follows on {colors.night}."
  focal: "Each band leads with its heading in {typography.section} ({typography.heading-lg} on a phone), left-aligned. The check marks are the next thing the eye finds; in a proof band, the platform marks in colour, the figures in {typography.tally} and the stars. The {colors.primary} button is the one strong colour on screen; a form's progress fill is the only other place it appears."
  never:
    - "a rating or review without its source's mark, or proof on {colors.night}: the mark in colour is how the reader knows whose it is"
    - "a pill, or a radius other than {rounded.tight} and {rounded.card} — the two radii tell pressed things from containers"
    - "text over a photograph, or a photograph faded into a colour — the head's photograph is a strip beneath the words"
    - "claims as running paragraphs — the check is the unit of scanning"
    - "photographs four across, or a 3 + 1 row — an orphan reads as a leftover"
    - "logo marks on {colors.night} — they are drawn for white, and on dark they need chips and look like stickers"
    - "a shadow or a gradient — depth is the light/dark band split"
