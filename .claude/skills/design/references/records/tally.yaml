# Tally — the lead-generation arm. Studied from contractor quote pages that
# convert: checked claims that scan at a glance, photographs of the work, cards
# and tap tiles, and proof shown with the marks of whoever gave it.
# The one idea: every rating, review and certification carries its source's own
# mark in full colour (Google's G, Facebook's f, the manufacturer's badge) on a
# light band, so the reader sees whose stars they are. Dark is kept for the one
# closing band and the footer. (Proof on dark bands, the first version, hid the
# marks and read as an odd purple banner; 2026-09-24.)
id: tally
title: Tally
summary: >
  A lead-generation system: one heavy grotesk on white, one action colour,
  checked one-line claims, photographs of the work, and ratings, reviews and
  certifications on light bands, each with its source's mark in colour.
tokens:
  colors:
    primary: "#1FD65F"
    primary-deep: "#0A6B30"
    canvas: "#FFFFFF"
    panel: "#F2F4F6"
    line: "#D5DAE0"
    ink: "#0E1116"
    ink-muted: "#454C57"
    night: "#14181F"
    night-muted: "#AEB6C2"
    star: "#FFB81C"
    # the website's colour roles (styles/input.css, the layout and the shared components read these)
    surface: "{colors.canvas}"
    ink-2: "{colors.ink-muted}"
    ink-3: "{colors.ink-muted}"
    night-ink: "{colors.canvas}"
    night-ink-2: "{colors.night-muted}"
    accent: "{colors.primary}"
    accent-ink: "{colors.ink}"
    accent-hover: "{colors.primary-deep}"
    line-strong: "{colors.line}"
    line-on-night: "rgb(255 255 255 / 0.16)"
  typography:
    display:
      fontFamily: "Schibsted Grotesk"
      fontSize: 56px
      fontWeight: 800
      lineHeight: 1.04
      letterSpacing: -1.4px
    section:
      fontFamily: "Schibsted Grotesk"
      fontSize: 46px
      fontWeight: 800
      lineHeight: 1.08
      letterSpacing: -0.9px
    display-md:
      fontFamily: "Schibsted Grotesk"
      fontSize: 34px
      fontWeight: 800
      lineHeight: 1.06
      letterSpacing: -0.8px
    heading-lg:
      fontFamily: "Schibsted Grotesk"
      fontSize: 28px
      fontWeight: 800
      lineHeight: 1.1
      letterSpacing: -0.5px
    title:
      fontFamily: "Schibsted Grotesk"
      fontSize: 24px
      fontWeight: 700
      lineHeight: 1.2
      letterSpacing: -0.3px
    heading-sm:
      fontFamily: "Schibsted Grotesk"
      fontSize: 19px
      fontWeight: 700
      lineHeight: 1.3
      letterSpacing: 0px
    lede:
      fontFamily: "Schibsted Grotesk"
      fontSize: 19px
      fontWeight: 400
      lineHeight: 1.5
      letterSpacing: 0px
    copy:
      fontFamily: "Schibsted Grotesk"
      fontSize: 18px
      fontWeight: 400
      lineHeight: 1.55
      letterSpacing: 0px
    tally:
      fontFamily: "Schibsted Grotesk"
      fontSize: 44px
      fontWeight: 800
      lineHeight: 1
      letterSpacing: -1px
      fontFeature: tnum
    label:
      fontFamily: "Schibsted Grotesk"
      fontSize: 17px
      fontWeight: 700
      lineHeight: 1.2
      letterSpacing: 0px
    caption:
      fontFamily: "Schibsted Grotesk"
      fontSize: 15px
      fontWeight: 500
      lineHeight: 1.45
      letterSpacing: 0px
      fontFeature: tnum
  rounded:
    tight: 6px
    card: 14px
    # the website's roles: control (pressed or typed) and card (containers)
    control: "{rounded.tight}"
  spacing:
    step-xs: 4px
    step-sm: 12px
    step-md: 20px
    step-lg: 40px
    step-xl: 72px
    step-xxl: 112px
    # the website's roles: between bands, and between groups inside a band
    section: "{spacing.step-xl}"
    lead: "{spacing.step-lg}"
  containers:
    content: 1152px
    wide: "{containers.content}"
sections:
  overview: >
    Tally shows whose word each thing is. The company speaks in checked
    claims, steps and photographs of its work. Other people's words (ratings,
    reviews, certifications) carry their source's own mark in full colour, on
    {colors.canvas} or {colors.panel}, so the reader sees at a glance that the
    stars are Google's and the badge is the manufacturer's. {colors.night} is
    kept for the closing band and the footer. One family,
    Schibsted Grotesk, carries everything; weight does the hierarchy.
    {colors.primary} fills the primary action and nothing else, and is expected
    to be replaced by the brand's own colour.
  colors: >
    {colors.canvas} is the ground and the form card. {colors.panel} is the
    alternate band ground, the answer tiles and the badge chips. {colors.ink} is all text on
    light ground;
    {colors.ink-muted} is secondary text and the reassurance line under a
    button, when the brief gives one. {colors.night} is the closing band and the footer; on it,
    {colors.canvas} carries the words and {colors.night-muted} the labels.
    Stars are the star graphic (/images/platforms/star.svg) or glyphs in {colors.star}, beside a
    rating figure that states the rating in text, so they are decoration and need no contrast
    of their own (the `stars` component pair is declared on {colors.night} only so the token
    passes the contrast lint). {colors.primary} fills the primary button under
    {colors.ink} text; {colors.primary-deep} is its hover and the check marks
    beside claims. {colors.line} is a form's progress track, the card borders
    and the rules between list rows.

    With the brand's own colour: the system expects the brand's colour here: any brand colour that carries {colors.ink} text at 4.5:1 fills the action and the progress fill, and {colors.primary-deep} follows as the hover (under {colors.canvas} text) and the check marks, so it must hold 4.5:1 on {colors.canvas}; a brand colour too dark for ink text cannot fill the action, but can be set on {colors.primary-deep} and {colors.night} by overlay while a lighter brand colour takes the slot.
  typography: >
    Schibsted Grotesk throughout. {typography.display} for the hero
    headline, {typography.section} for section heads, {typography.title}
    for card and step titles, {typography.heading-sm} for form questions and
    claim lead-ins, {typography.copy} for prose, {typography.label} for
    buttons, tiles and checked claims, {typography.caption} for attributions,
    reassurance and badges. {typography.tally} is the rating figure in the
    banner. Sentence case everywhere, including buttons. Measure under 60
    characters.
  layout: >
    A twelve-column grid at 1152px with {spacing.step-lg} gutters; one column with
    {spacing.step-md} margins below 768px. A band that pairs text with a card is a
    7/5 split, the text on the left and the card on the right; on a phone the
    card follows the text directly. A banner of figures runs the full width on
    {colors.panel}. Bands alternate {colors.canvas} and {colors.panel},
    with {colors.night} for the closing band only, in the order the page type sets; the
    system decides only how each band looks. A card set beside a long list
    may sit sticky in its column.
  elevation_and_depth: >
    Flat. Depth is the alternation of {colors.canvas} and {colors.panel}, the one dark close, and a one-pixel {colors.line}
    border on the form card and inputs. No shadows, no gradients.
  components: >
    Two radii. {rounded.tight} (6px) for everything pressed or typed:
    buttons, inputs, answer tiles, badges. {rounded.card} (14px) for
    containers: the form card, review cards, photographs. Nothing is a pill.

    Form card: {colors.canvas} card, {rounded.card}, a one-pixel {colors.line}
    border. A form that asks choices is stepped: a {colors.line} progress
    track with a {colors.primary} fill and "Step 2 of 4" in {typography.caption},
    one question per step in {typography.heading-sm}, answers as
    {colors.panel} tiles, 2-up, at least 56px tall; tapping one advances at
    once with no Continue button. A Back text button returns a step. A step
    with text inputs uses labelled inputs and the primary button, with the
    reassurance line under it when there is one. Rating banner: {colors.panel}, one cell per
    platform: the platform's mark in colour (about 32px), the figure in {typography.tally}
    {colors.ink}, the stars as star graphics, then the count in {typography.caption}. Checked claim: a
    {colors.primary-deep} check, the claim in {typography.label}, an optional
    one-line gloss in {colors.ink-muted}. Review card: {colors.canvas} at {rounded.card}
    on a {colors.panel} band, the platform's mark and stars on one line, the
    quote, then the attribution in {typography.caption} {colors.ink-muted}. Badge:
    {colors.panel} chip at {rounded.tight} carrying the name of a licence,
    award or accreditation.
  dos_and_donts:
    do:
      - rule: "Use the split head (words left, card right) on purpose: a lead page's reader acts on the first screen, so the action sits beside the promise, as the landing guide asks."
        why: "The split hero is a generated-page default when it is automatic; here it is declared, and the full-bleed work strip, the checks and the marked proof are what make it tally."
      - rule: "Set every rating, review and certification with its source's own mark in full colour, on {colors.canvas} or {colors.panel}."
        why: "A reader trusts a rating when they can see whose it is; the marks are drawn for light ground, and in colour they are the brightest things on a quiet page."
      - rule: "Set certification and membership logos on their own {colors.canvas} bar, trimmed to their visible edges and sized by shape (a square badge taller than a wordmark) so they read as one height, on one line."
        why: "Logos are drawn for white; on a dark band they need chips and look like stickers. Their files carry uneven margins, so matching pixel heights does not match what the eye sees."
      - rule: "Set a checked claim as a {colors.primary-deep} check beside {typography.label}, with any gloss beneath in {colors.ink-muted}; in the dark close the check and text turn {colors.canvas}."
        why: "The check is the system's unit of scanning; one treatment everywhere lets a reader skim the page by its checks alone. What the claims say is the page type's business."
      - rule: "When a form asks choices, step it: one question per step, {colors.panel} tiles 2-up, and a tap on a tile advances with no Continue button."
        why: "Each tap is a small yes that costs nothing; a Continue button turns every step into two decisions."
    dont:
      - rule: "Don't set buttons or headings in capitals, or rotate or type out a headline."
        why: "Capitals and moving text are slower to read; the offer has to be taken in at one glance."
      - rule: "Don't use {colors.primary} for anything but the primary button and the progress fill."
        why: "It is the only colour that means tap here; spent on decoration it stops meaning it."
      - rule: "Don't set a list of claims as running paragraphs."
        why: "The check is the unit of scanning; a claim buried in a paragraph loses the one treatment that lets a reader skim the page by its checks."
  responsive_behavior: >
    Designed at 390px first. Below 768px: one column, {spacing.step-md} margins,
    the headline is {typography.display-md} and section heads
    {typography.heading-lg}; {typography.display} and
    {typography.section} take over from 768px. A card beside text follows
    the text, full width. The rating banner goes 2-up. Review cards stack.
    Buttons are full width. Tap targets are never below 48px.
  known_gaps: >
    No dark theme. A form is built only when the brief gives its fields and where it sends;
    without them the card's action is a button to the brand's own form (the landing guide's
    rule), never a form that ends on a thank-you step having sent nothing. No video treatment beyond a poster
    frame at {rounded.card} with a caption.

