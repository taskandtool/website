      counts: "1–2: side by side at 6 + 6. 3: three across from 768px. 4: four across from 1024px, 2 × 2 below. 5–8: two columns (four from 1024px when values are short). 9+: two columns grouped under {typography.heading-sm} heads, or a table if the keys repeat."
    qa:
