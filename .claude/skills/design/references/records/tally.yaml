# The website's lint hints this system uses on purpose (scripts/lint.mjs).
x_declares: []

# ── Extensions ────────────────────────────────────────────────────
x_invariants:
  style:
    - "Ratings, reviews and certifications on {colors.canvas} or {colors.panel}, each with its source's mark in colour; {colors.night} only for the closing band and the footer."
    - "Logo marks sit on their own {colors.canvas} bar: trimmed to their ink, one optical height, centred on one line, spanning the content width."
    - "{rounded.card} for every container, {rounded.tight} for everything pressed or typed; nothing is a pill."
    - "A stepped form asks one question per step and advances on a tile tap."
  accessible:
    - "Every form input has a visible label; tiles are buttons, 48px minimum, reachable by keyboard."
    - "Stars (the star graphic) always sit beside a figure that states the rating in text; {colors.primary} never as text."

x_imagery:
  role: >
    Evidence, and plenty of it: tally is photograph-led. Where a band has photographs it shows
    them first and large, and the page carries more pictures than paragraphs. A photograph sits
    at {rounded.card} with its caption beneath, never as decoration and never behind a band's
    text.
  density: "every photograph the brief places, and the brief should place many: one per item where it has one, a band of finished work, the team, customers' own photographs with their reviews; none decorative"
  treatment: >
    Photographs at {rounded.card}, in a 2- or 3-up grid, each with its
    caption beneath when it has one. The hero may carry one wide photograph
    full-bleed, as a strip beneath the words and the card, never under them: the
    words stay on {colors.canvas} and nothing fades. On a phone the strip sits
    between the words and the next band.
  aspect_ratios: ["4/3", "3/2", "1/1", "16/9"]
  caption: >
    {typography.caption} in {colors.ink-muted} beneath the photograph. Its
    words come from the brand folder (see standards/copy.md).
  forbidden:
    - "text over a photograph"
    - "a photograph used as decoration"
  no_assets_supplied: >
    If the brief supplies no images, do not invent image paths. With no
    photographs the page has no image grid; the proof bands carry the visual
    weight.

x_emphasis:
  device: "a full-width banner of cells on `bg-panel`, the figure in `text-tally` `text-ink` with what it counts and its source beneath in `text-caption` `text-ink-muted`; when the figure is a rating, the platform's own mark in colour leads the cell, the stars as star graphics (/images/platforms/star.svg) sit beside the figure, and each platform takes its own cell"
  applies_to: "the one figure the page leads on, once per page; siblings of the same kind take further cells in the same banner"
  why: "A full-width band of cells is the one element every reader scrolls across; on light ground the platform's mark reads in its own colours, so the reader sees whose rating it is before reading the number."

# How any band of any page is laid out in this system.
# Look only: never a page type, never what content goes where.
x_motion:
  principle: "still: the page is evidence for a reader deciding on the first screen, and anything that rises or fades in delays the promise, the checks and the card that the split head puts side by side. The button's fill changes to {colors.primary-deep} on hover, instantly; nothing else changes."
  reduced: "nothing moves in any case; nothing is hidden at any time"

x_layout:
  measure:
    reading: "50–60ch, never over 60 — {typography.copy}, {typography.lede} for a lead line"
    caption: "the width of the photograph above it; {typography.caption} {colors.ink-muted}"
  grid:
    columns: 12
    container: "1152px; {spacing.step-md} side margins at every width"
    gutter: "{spacing.step-lg} between columns and cards ({spacing.step-md} inside a grid of cards)"
    text_columns: "the left 7 of a 7/5 split, or 6 beside a 5-column card; running text held to measure.reading"
    media_columns: "photographs in a 2- or 3-up grid across 12 at {rounded.card}; one wide photograph may run the head full-bleed; a photograph beside text takes 5 or 8 columns"
  rhythm:
    section: "{spacing.step-xl} → {spacing.step-lg}"
    group: "{spacing.step-lg} → {spacing.step-md}"
    item: "{spacing.step-md} between rows and cards"
    element: "{spacing.step-xs} title to line; {spacing.step-sm} between checked lines"
    separator: "surface — bands alternate {colors.canvas} and {colors.panel}, with {colors.night} for the closing band only; inside a band, rows open on a 1px {colors.line} top rule; no hairline between bands of the same ground — change the ground instead"
  registers:
    persuasion:
      head: statement
      type: "{typography.display} title ({typography.display-md} below 768px), {typography.section} band heads ({typography.heading-lg} below 768px), {typography.title} card titles, {typography.label} checked claims, {typography.lede} leads"
      rhythm: "as rhythm; bands alternate {colors.canvas} and {colors.panel}, the close on {colors.night}, and a band that pairs text with a card is a 7/5 split"
    retrieval:
      head: plain
      type: "{typography.section} title ({typography.heading-lg} below 768px), {typography.heading-sm} group heads, {typography.label} for names and keys, {typography.copy} values, {typography.caption} sources"
      rhythm: "one step denser: section {spacing.step-lg} → {spacing.step-md}, group {spacing.step-md}; what the reader came for (facts, table, rows) starts on the first screen across 12 columns; {colors.night} never behind the facts"
    reading:
      head: plain
      type: "{typography.section} title, {typography.lede} lead, {typography.title} subheads, {typography.copy} text"
      rhythm: "one column at measure.reading, columns 1–7 on {colors.canvas}; checked lines may sit inside the text; a quotation drops in as one review card, with its platform's mark, only if it is someone else's words"
  head:
    statement: "A 7/5 split on {colors.canvas}: the title in {typography.display} {colors.ink}, a {typography.lede} lead in {colors.ink-muted}, and up to three checked claims in {typography.label}, in the left 7; a card in the right 5 (a form card, or the action with its reassurance line). With a wide photograph (landscape, 1600px or wider, the finished job or the crew at work, its subject in the middle band of the frame since the strip crops top and bottom to about 2/1), it runs full-bleed as a strip beneath the words and the card, never under them: the words stay on {colors.canvas} and nothing fades. With none, the words and card stand alone on {colors.canvas}."
    plain: "On {colors.canvas}: the title in {typography.section} ({typography.heading-lg} below 768px) across 7 columns and one lead line in {typography.lede} {colors.ink-muted}; no photograph, no card, a 1px {colors.line} rule under it. The content starts {spacing.step-lg} below."
  shapes:
    items:
      as: "a grid of checked rows; a grid of cards when each item has a photograph"
      look: "a {colors.primary-deep} check (on {colors.night}: {colors.canvas}), the name in {typography.label}, a gloss in {typography.copy} {colors.ink-muted}, each row on a 1px {colors.line} top rule. With photographs: the photograph at {rounded.card} 4/3, the name in {typography.title}, checked lines beneath; on a {colors.panel} band each item is a {colors.canvas} card at {rounded.card} with {spacing.step-sm} padding"
      counts: "1–3: one column of checked lines under the band head. 4–6: one column in the 7 beside a 5-column card, or two columns across 12. 7–12: two columns. With photographs: 2 at 6 + 6, 3 at 4 × 3, 4 at 3 × 4 (2 × 2 below 1024px), 5 as 3 then 2 at 6 + 6, 6 as 3 × 2, 7+ in rows of 3 closing on a 2-up row. When only some items have photographs, the photographed ones are cards and the rest follow as checked rows (name, one line) beneath them; never a card with an empty image. Short names past 12 (places, brands, services): {colors.panel} chips at {rounded.tight} in {typography.label}, a wrapping cluster, grouped under {typography.heading-sm} heads."
    table:
      as: "table on the band's ground"
      look: "column heads in {typography.caption} {colors.ink-muted}, row heads in {typography.label} {colors.ink}, values in {typography.copy} and numbers with tabular numerals, a 1px {colors.line} rule between rows; the row that matters may take {colors.panel}; on a {colors.panel} band the table sits in a {colors.canvas} card at {rounded.card}"
      counts: "2–8 rows: across 7 beside a card, or 12. 9–30: across 12. 30+: one table per group under {typography.heading-sm} heads. 3+ columns below 768px: each row becomes a {colors.canvas} card — row head in {typography.label}, the other columns as caption label/value pairs — never a sideways scroll."
    facts:
