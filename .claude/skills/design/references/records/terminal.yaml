# Dark developer system. The ground is unlit CRT glass, not black; the accent is
# P3 amber phosphor, not acid green; every number is set in the monospace and
# every sentence in the sans; the statement head is a panel beside the statement
# rather than a headline over a photograph.
id: terminal
title: Terminal
summary: >
  A phosphor-screen system: dark green-grey glass for the ground, a lit raster
  panel for content, amber phosphor reserved for the action and the on state,
  and a matched sans/mono pair where the mono carries every number.
tokens:
  colors:
    primary: "#F5A524"
    glass: "#161E1C"
    raster: "#202B28"
    scanline: "#2E3B37"
    ash: "#E7EEEB"
    ash-dim: "#A9B7B2"
    ash-faint: "#8A9994"
    manpage-ink-soft: "#3C4A46"
    # the website's colour roles (styles/input.css, the layout and the shared components read these)
    canvas: "{colors.glass}"
    surface: "{colors.raster}"
    panel: "{colors.raster}"
    night: "{colors.glass}"
    ink: "{colors.ash}"
    ink-2: "{colors.ash-dim}"
    ink-3: "{colors.ash-faint}"
    night-ink: "{colors.ash}"
    night-ink-2: "{colors.ash-dim}"
    accent: "{colors.primary}"
    accent-ink: "{colors.glass}"
    accent-hover: "{colors.ash}"
    line: "{colors.scanline}"
    line-strong: "{colors.scanline}"
    line-on-night: "{colors.scanline}"
  typography:
    display:
      fontFamily: "Spline Sans"
      fontSize: 60px
      fontWeight: 500
      lineHeight: 1.04
      letterSpacing: -1.5px
    section:
      fontFamily: "Spline Sans"
      fontSize: 40px
      fontWeight: 500
      lineHeight: 1.1
      letterSpacing: -0.8px
    title:
      fontFamily: "Spline Sans"
      fontSize: 24px
      fontWeight: 500
      lineHeight: 1.25
      letterSpacing: -0.3px
    lede:
      fontFamily: "Spline Sans"
      fontSize: 20px
      fontWeight: 400
      lineHeight: 1.55
      letterSpacing: 0px
    copy:
      fontFamily: "Spline Sans"
      fontSize: 18px
      fontWeight: 400
      lineHeight: 1.6
      letterSpacing: 0px
    figure:
      fontFamily: "Spline Sans Mono"
      fontSize: 44px
      fontWeight: 400
      lineHeight: 1.0
      letterSpacing: -1px
      fontFeature: tnum
    data:
      fontFamily: "Spline Sans Mono"
      fontSize: 14px
      fontWeight: 400
      lineHeight: 1.5
      letterSpacing: 0px
      fontFeature: tnum
    caption:
      fontFamily: "Spline Sans Mono"
      fontSize: 12px
      fontWeight: 400
      lineHeight: 1.5
      letterSpacing: 0.2px
      fontFeature: tnum
    # label: the website's role, set the same as caption in this system
    label:
      fontFamily: Spline Sans Mono
      fontSize: 12px
      fontWeight: 400
      lineHeight: 1.5
      letterSpacing: 0.2px
      fontFeature: tnum
  rounded:
    cell: 3px
    square: 0px
    # the website's roles: control (pressed or typed) and card (containers)
    card: "{rounded.square}"
    control: "{rounded.cell}"
  spacing:
    step-xs: 4px
    step-sm: 8px
    step-md: 16px
    step-lg: 32px
    step-xl: 56px
    step-xxl: 96px
    # the website's roles: between bands, and between groups inside a band
    section: "{spacing.step-xxl}"
    lead: "{spacing.step-lg}"
  containers:
    content: 1280px
    wide: "{containers.content}"
sections:
  overview: >
    Terminal reads as an instrument, not a brochure. The ground is
    {colors.glass}, the green-grey of an unlit cathode-ray screen; it is not
    black and must not be darkened towards black. Content sits on panels in
    {colors.raster}, the lit area of the screen, and a panel opens with a
    one-line status bar in {typography.data} carrying its heading from the
    brief, or a fact the brief states; with neither, the bar is omitted. That
    status bar is the system's heading device, which is why the tracked-out
    eyebrow label does not exist here. Two typefaces from one drawing: Spline
    Sans for every sentence, Spline Sans Mono for every number, date, name,
    reading and control label. {colors.primary}, an amber phosphor, appears on
    the single primary action, on state cells marked on, and on
    at most one emphasised figure per page. Nothing else glows.
  colors: >
    Eight colours. {colors.glass} is the page ground and the fill of inputs and
    secondary buttons. {colors.raster} is the lit panel and the only surface
    step on the dark; there is no third depth. Once per page a man-page band
    turns the lights on: {colors.ash} ground, {colors.glass} text,
    {colors.manpage-ink-soft} for its secondary lines. {colors.scanline} draws every hairline,
    table rule and border, and fills state cells marked off — it is never a
    text colour. {colors.ash} is the text colour for headings, table rows and
    controls; {colors.ash-dim} carries prose and status bars; {colors.ash-faint}
    carries captions and table heads and is the lightest text permitted on
    {colors.raster} (4.91:1). {colors.primary} is the only chromatic colour and
    always carries {colors.glass} text when it is a fill (8.32:1). Hover is
    reverse video: a {colors.primary} fill swaps to {colors.ash} with
    {colors.glass} text. No colour is ever set at reduced opacity.

    With the brand's own colour: a brand colour replaces the amber phosphor on the one action, state cells marked on and the one emphasised figure; it must be a light chromatic colour that carries {colors.glass} text at 4.5:1 and reads at 4.5:1 as text on {colors.raster}, and by invariant it may not be green, cyan or red — a brand whose colour is any of those, or too dark to glow, keeps amber. Hover is reverse video to {colors.ash}, so nothing is derived from it.
  typography: >
    Spline Sans at 400 and 500 for prose and headings; Spline Sans Mono at 400
    for everything measured or named. Display sizes take negative tracking
    (-1.5px at 60px); {typography.figure} is the mono at 44px with -1px so a
    large reading holds together. {typography.data} at 14px is the working
    size of the system: table rows, status bars, button labels, key/value
    pairs. {typography.caption} at 12px carries image captions and table
    heads with +0.2px tracking, the only place tracking opens. Prose measure
    stays under 68 characters; mono runs stay under 80. Nothing is set in
    capitals.
  layout: >
    A twelve-column grid at 1280px with 32px gutters, dropping to one column
    with 16px margins below 768px. A band may split 7/5, text on the seven
    and a panel on the five. Sections are separated by a full-width
    hairline in {colors.scanline}, never by whitespace alone. Comparable
    things go in a table, with a head row and hairline rules between rows;
    they never go in a card grid. Photographs sit inside panels as captures,
    each with its caption row beneath when it has one. Panels may sit edge to edge with a single
    hairline between them; they never overlap.
  elevation_and_depth: >
    Two tones and a hairline. {colors.glass} is the ground, {colors.raster} is
    the panel, {colors.scanline} is the edge. No box-shadow, no backdrop blur,
    no gradient, no translucent fill. If something must come forward, it gets
    a {colors.scanline} border and sits on {colors.raster}; if it must recede,
    it sits on {colors.glass}. There is no third step and none should be
    invented.
  components: >
    Two radii: {rounded.cell} (3px) on buttons, inputs, badges and grid cells —
    the softening of a character cell, no more — and {rounded.square} (0px) on
    every panel, table, image and section. No pill exists in this system. A
    rounded panel or a rounded photograph is a mistake, not a variant.

    Buttons are {rounded.cell} rectangles with a {typography.data} label, so
    they read as commands. Primary is a {colors.primary} fill with
    {colors.glass} text; on hover it inverts to {colors.ash} with
    {colors.glass} text over 150ms. Secondary is {colors.glass} with a
    {colors.scanline} border and {colors.ash} text; it inverts the same way.
    Inputs and selects are {colors.glass} with a {colors.scanline} border and a
    {colors.primary} outline on focus. Tables have a {colors.raster} head row
    in {typography.caption} and {colors.glass} body rows in {typography.data}
    separated by {colors.scanline} rules. A state cell is a {rounded.cell}
    cell marked on or off: {colors.primary} with {colors.glass} text when on,
    {colors.scanline} with {colors.ash-dim} text when off, the state also
    written in the cell so colour never carries it alone. Quotes sit on a {colors.raster} panel in
    {typography.lede} with the attribution in {typography.data} beneath.
    A short attestation (a licence, a membership, a rating's platform) is a {typography.caption}
    badge on {colors.raster} with a {colors.scanline} border, carrying the words the brief gives it.
  dos_and_donts:
    do:
      - rule: "Open a panel with a status bar in {typography.data} carrying its heading from the brief, or a fact the brief states; where the brief gives neither, omit the bar."
        why: "The status bar is the system's heading device and what makes an eyebrow label unnecessary; its words are the brief's, so the device never needs text of its own."
      - rule: "Set every number, date, time, measurement, proper name of a unit or a place, and every control label in Spline Sans Mono."
        why: "The mono/sans split is how a reader tells data from prose without reading it; a figure set in the sans is invisible."
      - rule: "Spend {colors.primary} on the primary action, on state cells marked on, and on at most one emphasised figure per page. Nothing else."
        why: "A phosphor that glows everywhere is a colour scheme; one that glows in three defined places is an instrument."
      - rule: "Put comparable things in a table with a head row and hairline rules."
        why: "A table encodes the comparison; a row of cards decorates it and makes every item the same importance."
      - rule: "Make hover reverse video: swap the fill to {colors.ash} and the text to {colors.glass}."
        why: "Inversion is the display's own idiom for selection; a lighten or a glow reads as a web default the system did not choose."
    dont:
      - rule: "Don't darken {colors.glass} towards black, or introduce #000 or a neutral near-black anywhere."
        why: "The green-grey ground is the one thing separating this from the generic near-black developer page; a neutral black under it flattens the whole system to that default."
      - rule: "Don't use any green, cyan or vermilion accent, or a second chromatic colour."
        why: "Near-black with acid green is the named default for this family; amber is the deliberate alternative, and a second hue would turn a single instrument reading into a colour scheme."
      - rule: "Don't apply a box-shadow, backdrop blur, gradient or translucent fill."
        why: "Depth here is two tones and a hairline; any of these adds a third depth cue the system does not have and makes the panels read as cards."
      - rule: "Don't set a heading, label or button in capitals, and don't prefix a heading with a tracked-out label."
        why: "The status bar already does that job with real information; a capitalised label above it is decoration and the commonest generated-page tell."
      - rule: "Don't add a blinking cursor, a shell prompt glyph, or ASCII box-drawing as decoration."
        why: "These are the hacker-film costume of a terminal; the system is built on the display's physical properties, and the costume announces a theme rather than a product."
      - rule: "Don't use a pill or any radius other than {rounded.cell} and {rounded.square}."
        why: "A 3px cell is the only softening a character grid allows; a pill or an 8px card corner imports the SaaS kit wholesale."
  responsive_behavior: >
    Below 768px the grid collapses to one column with {spacing.step-md} margins;
    a panel beside a statement moves below it and keeps its status bar. {typography.display} drops to 40px with -1px tracking.
    Tables wider than the viewport scroll horizontally inside their panel
    rather than reflowing into cards. Grids of state cells reduce from twelve
    columns to six. Section spacing goes from {spacing.step-xxl} to {spacing.step-xl}.
    Tap targets are never below 44px. The hover inversion is retained on
    focus-visible.
  known_gaps: >
    No light theme exists and none should be invented — the system's identity
    is the lit-screen tone pair. No chart palette is defined beyond
    {colors.primary} against {colors.scanline}; a single-series chart may use
    them, a multi-series chart should ask. Spline Sans and Spline Sans Mono
    are on Google Fonts; the fallback stacks are system-ui and ui-monospace
    respectively and are not tuned. Motion is deliberately limited to the
    150ms hover inversion; no entrance animation is defined.

