# The website's lint hints this system uses on purpose (scripts/lint.mjs).
x_declares:
  - dark-bands
x_declares_reasons:
  dark-bands: The room is unlit glass by design, so most bands are dark; the one man-page band on
    {colors.ash} is the relief, and the lit panels inside each band carry the contrast.

# ── Extensions ────────────────────────────────────────────────────
x_invariants:
  style:
    - "The ground is {colors.glass}. No #000, no neutral near-black, no darkening."
    - "One chromatic colour: {colors.primary}. No green, cyan or red anywhere."
    - "Every number and control label is in Spline Sans Mono; every sentence is in Spline Sans."
    - "No box-shadow, backdrop blur, gradient or translucent fill."
    - "Radii are cell (3px) or square (0px) only. No pill."
    - "A status bar carries only the brief's words, a heading or a stated fact; with neither, it is omitted."
  accessible:
    - "Text on {colors.raster} never lighter than {colors.ash-faint} (4.91:1)."
    - "{colors.scanline} is never a text colour."
    - "{colors.primary} fills always carry {colors.glass} text (8.32:1)."
    - "Focus is a visible {colors.primary} outline at 2px; hover states are duplicated on focus-visible."
    - "Tap targets >= 44x44px at every breakpoint."

# The DESIGN.md spec has no imagery section, so this is ours.
x_imagery:
  role: >
    Evidential. The product's own screen recordings and captures are the imagery: a terminal session,
    an interface, a mascot or icon the company draws for each tool. A recording or photograph sits in a
    panel like a readout, edge to edge, with its caption row beneath. It never carries a headline. Only
    the head's recording plays; any other recording on the page shows its first frame and plays on
    hover or focus, with a control, so a page of ten tools is not ten moving screens.
  density: "one image per content section where supplied; a statement head pairs its image with a panel rather than putting text on it"
  treatment: >
    Square corners, no rounding, no border radius, no overlay, no scrim, no
    tint, no text on top. An image fills its panel edge to edge and, when it
    has a caption, is followed by a caption row in {typography.caption} on
    {colors.raster}. Images
    are separated from other panels by the same {colors.scanline} hairline.
  aspect_ratios: ["16/9", "3/2", "1/1"]
  caption: >
    A caption row beneath the image on {colors.raster}, in
    {typography.caption} in {colors.ash-faint}, when the brand folder records
    one. Its words come from the brand folder (see standards/copy.md).
  accepts: [screenshot]   # a capture of the product's own interface is this system's material, not a defect
  forbidden:
    - "text or headings overlaid on a photograph"
    - "a scrim, gradient, tint, duotone or filter"
    - "rounded corners, shadows or drop-borders on an image"
    - "a photograph used as a section background"
  no_assets_supplied: >
    If the brief supplies no images, do NOT invent placeholder <img> paths.
    Let the panels, tables and figures carry the visual weight; no empty
    capture panel is drawn.

# How this system emphasises ONE figure. The renderer reads this; it must never
# hardcode a token name, because tokens are per-system.
x_emphasis:
  device: "a `bg-raster` panel with the figure in `text-primary` at `text-figure`"
  applies_to: "at most one statistic per page, and only the one the brief names as its lead figure; a number already said in a line of copy is not set again as a figure (Charm's 25,000 appeared twice)"
  why: "The phosphor is spent on the action and the on state; the one place it appears as a number is the page's loudest reading."

# How any band of any page is laid out. Look only: the page type picks the bands
# and the mode, the brief fills them, this says how each shape sits on the screen.
x_layout:
  measure:
    reading: "60–68ch, {typography.copy} in Spline Sans; runs of {typography.data} stay under 80ch"
    caption: "under 80ch, {typography.caption} in {colors.ash-faint} on {colors.raster}"
  grid:
    columns: 12
    container: "1280px, {spacing.step-lg} side padding; {spacing.step-md} below 768px"
    gutter: "{spacing.step-lg} → {spacing.step-md} below 768px; panels that touch meet at one {colors.scanline} hairline instead"
    text_columns: "7, 5 or 12-column spans; running text held to measure.reading inside the span"
    media_columns: "5, 7 or 12 columns, the image edge to edge inside a {colors.raster} panel with a {colors.scanline} border"
  rhythm:
    section: "{spacing.step-xxl} → {spacing.step-xl}"
    group: "{spacing.step-lg} → {spacing.step-md}"
    item: "{spacing.step-sm} row padding inside a panel, {spacing.step-md} between panels"
    element: "{spacing.step-xs} → {spacing.step-sm}"
    separator: "rule — a full-width {colors.scanline} hairline closes each band and a status bar on {colors.raster} opens the next; rows inside a panel split on the same hairline. Once per page, the relief: a man-page band on {colors.ash} with {colors.glass} text (14.4:1) and {colors.manpage-ink-soft} secondary text (7.9:1), set like printed documentation (the install command, a quick start, the facts), so the dark room has a lit page in it"
  registers:
    persuasion: { head: statement, type: "{typography.display} head, {typography.section} band headings, {typography.lede} lead, {typography.figure} in {colors.primary} for the one emphasised figure", rhythm: "{spacing.step-xxl} band padding; 7/5 splits with the working panel on the five; one capture per band" }
    retrieval: { head: plain, type: "{typography.section} title, {typography.title} group heads, {typography.data} for rows, keys, values and controls", rhythm: "one step denser: {spacing.step-xl} band padding, {spacing.step-sm} rows; tables and key/value panels at 7 or 12 columns; the status bar carries each group's heading; captures only where the brief gives one to a group" }
    reading: { head: plain, type: "{typography.section} title, {typography.copy} at measure.reading, {typography.title} subheads, {typography.data} for any figure or name in the text", rhythm: "one column at measure.reading from column 1; a table, figure or capture the text refers to breaks out to 7 columns as a panel; paragraphs {spacing.step-md} apart" }
  head:
    statement: "A 7/5 split at {spacing.step-xxl} top padding: on the seven, the statement in {typography.display} ({typography.section} below 768px), the lead in {typography.lede} at {spacing.step-lg} beneath, then the primary and secondary buttons; on the five, a {colors.raster} panel opening with a status bar that names the program the way a terminal title does (`crush — ~/src`), holding the product running. Best: the company's own screen recording of the product at work (a terminal session or its interface, 16/9, 1200px wide or more, muted, looped, inline, its first frame as the poster, a pause control in the status bar), edge to edge under the status bar with no border radius; a promo cut that mixes title cards with the product is fine here, because the statement sits beside it, never on it. Then a still capture of the interface at the same size; then the working thing the brief gives (a form, a key/value readout, state cells). The statement is short (eight words or fewer), so a 7/5 split holds it in three lines at {typography.display}. Below 768px the panel follows the statement. With nothing for the panel, the statement takes 8 columns and the lead photograph follows at 12 as a capture."
    plain: "A status bar row carrying the title's subject or a stated fact (omitted with neither), then the title in {typography.section} and one lead line in {typography.lede} across 7 columns at {spacing.step-xl} top padding; no panel, no image, no figure. The first table, facts panel or form starts {spacing.step-lg} beneath, on the first screen."
  close: "A {colors.raster} panel across 12 columns: its status bar, the ask in {typography.section} {colors.ash} on 7, one {typography.lede} {colors.ash-dim} line, and on 5 the {colors.primary} button above the install command in a {colors.glass} well in {typography.data} with a copy control; {spacing.step-xl} padding; the footer follows on {colors.glass} below a {colors.scanline} hairline."
  shapes:
    items:
      as: "table, or a stack of hairline rows inside a panel"
      look: "name in {typography.data} at {colors.ash}, its line in {typography.copy} at {colors.ash-dim}; rows at {spacing.step-sm} padding split by {colors.scanline}"
      counts: "1: fold into prose. 2–4: hairline rows in a 5-column panel beside 7 columns of text. 5–12: a two-column table (name, line) at 7 columns beside a capture, or at 12 with none. 13+: one table at 12, or two 6/6 panels split at the midpoint, the odd item on the left. Never a card grid at any n."
    table:
      as: "table inside a bordered panel that scrolls horizontally"
      look: "head row on {colors.raster} in {typography.caption} at {colors.ash-faint}; body rows on {colors.glass} in {typography.data} at {colors.ash}, secondary cells at {colors.ash-dim}; {colors.scanline} hairlines between rows; figures tabular"
      counts: "1–2 rows: facts instead. 2–4 columns: 7 columns beside a 5-column capture or note panel. 5+ columns: 12. Any number of rows stays one table; below 768px it scrolls inside its panel, never reflows to cards."
    facts:
      as: "key/value rows in a bordered panel (a readout)"
      look: "key in {typography.data} at {colors.ash-dim} left, value at {colors.ash} right and unbroken; a closing source row on {colors.raster} in {typography.caption} at {colors.ash-faint}. A value that is on or off per slot sets as a row of state cells: {rounded.cell}, min 44px, {typography.caption}, on in {colors.primary} with {colors.glass} text, off in {colors.scanline} with {colors.ash-dim} text, the state written in the cell"
      counts: "1–4: a 5-column panel beside prose or inside the statement head's panel. 5–10: a 7-column panel. 11+: two 6/6 panels. State cells: up to 12 across at desktop, 6 below 768px; 7 slots sit 7 across at their natural width, not stretched to 12."
    qa:
      as: "stack of hairline rows"
      look: "question in {typography.lede} at {colors.ash}, answer in {typography.copy} at {colors.ash-dim} at measure.reading; {spacing.step-md} row padding, {colors.scanline} between pairs"
      counts: "1–5: one pair a row at 7 columns. 6–15: rows at 12, question on 5 and answer on 7. 16+: the same rows under a status bar per group the brief names. Answers are never hidden."
    people:
      as: "grid of capture panels"
      look: "portrait at 1/1 edge to edge in a {colors.raster} panel, a caption row beneath with the name in {typography.data} at {colors.ash} and the role in {typography.caption} at {colors.ash-faint}"
      counts: "1: 5/7, portrait panel and passage. 2: two 5-column panels, the last 2 columns empty glass. 3: 4/4/4. 4: 3/3/3/3 at 1280px, 6/6 twice below 1024px. 5: 4/4/4 then 4/4 left-aligned. 6: two rows of three. 7+: rows of four, the short last row left-aligned. No portraits: a table of name and role."
    sequence:
      as: "table, or an ordered stack of hairline rows in a panel"
      look: "step number or date in {typography.data} at {colors.ash-faint} in a narrow first column, the step in {typography.copy} at {colors.ash}; the number is never {colors.primary}"
      counts: "2–6: ordered rows in a 7-column panel. 7+: a table at 12 with the number or date as its first column. Dated entries with more than one fact each are always a table."
    media_text:
      as: "sidebar, 7/5"
      look: "the photograph as a capture panel with its caption row, beside text on {colors.glass} that opens with its heading in {typography.section}"
      counts: "1: the capture on the seven. Several: the capture flips side band to band. A 1/1 photograph takes the five, never the seven. Below 768px the capture follows the text."
    gallery:
      as: "grid of capture panels in 7/5 rows"
      look: "each image edge to edge in a bordered {colors.raster} panel with its caption row; {spacing.step-md} between panels; ratios 16/9, 3/2 and 1/1"
      counts: "1: 12 columns at 16/9. 2: 7/5, the five at 1/1. 3: 7 beside a stack of two on the 5. 4: 7/5 then 5/7. 5+: rows alternating 7/5 and 5/7, an odd last image at 12 and 16/9. Never a grid of equal square thumbnails."
    quote:
      as: "a {colors.raster} panel"
      look: "{typography.lede} at {colors.ash} at measure.reading, attribution in {typography.data} at {colors.ash-faint} beneath at {spacing.step-sm}; a {colors.scanline} border; no quote glyph"
      counts: "1: 7 columns, beside the band's heading or a capture on 5. 2: stacked on the seven, {spacing.step-md} apart. 3–4: 6/6 rows, balanced by length rather than by count. 5+: two 6-column stacks, the longest first in each."
    prose:
      as: "stack at measure.reading"
      look: "{typography.copy} at {colors.ash-dim}, paragraphs {spacing.step-md} apart, figures and names inline in {typography.data}"
      counts: "1–3 paragraphs: 7 columns beside a 5-column panel or capture. 4+: one column from column 1 at measure.reading, the other columns empty glass."
    form:
      as: "a {colors.raster} panel with a status bar"
      look: "labels in {typography.caption} at {colors.ash-faint}, inputs on {colors.glass} with a {colors.scanline} border and {rounded.cell}, values in {typography.data}, min 44px; the submit is button-primary at full panel width"
      counts: "1–3 fields: a 5-column panel beside 7 columns of text. 4–8: a 7-column panel, short fields two-up. 9+: a 12-column panel with groups under inner status bars."
    index:
      as: "table of links, or a stack of hairline rows"
      look: "title in {typography.title} at {colors.ash} with a {colors.scanline} underline that turns {colors.primary} on hover, its line in {typography.copy} at {colors.ash-dim}, a date in {typography.data}"
      counts: "1–6: hairline rows at 7 columns. 7+: a table at 12 (title, line, date). With images: 5/7 rows, the capture at 3/2 on the five."
  focal: "Each band leads with its status bar and its heading in {typography.section}; the working panel — table, readout, form — is the largest object after it; {colors.primary} marks at most the one action and the one figure, so the eye's second stop is amber and its third is data."
  never:
    - "Put a statement over a photograph, or open a band on a full-width image with text on it."
    - "Leave the five of a 7/5 split as an empty panel — with nothing for it, the text takes 8 and the band runs single-column."
    - "Reflow a table into cards on a narrow screen — it scrolls inside its panel."
    - "Set a gallery as a grid of equal square thumbnails."
    - "Stack two status bars with nothing between them — a bar heads a panel's contents, not another bar."
    - "Show on and off by colour alone — every state cell writes its state."
    - "Separate bands by whitespace alone — each ends on a {colors.scanline} hairline."
    - "Run the whole page dark — one man-page band on {colors.ash} is the relief a dark room needs."
    - "Autoplay more than the head's one recording."

x_motion:
  principle: "A screen that is on: the head's recording plays; everything else waits to be touched."
  entrance: "None beyond the recording: the page is there when it loads."
  signature: "The status bar's block cursor blinks at 1s in {colors.primary} beside the program name, and stops when the recording is paused; a capture's own recording plays while it is hovered or focused."
  scroll: "Nothing arrives on scroll."
  reduced: "Under prefers-reduced-motion no recording autoplays (the poster shows, with a play control) and the cursor is still."
  mechanism: "HTML video with muted, loop, playsinline and a poster; a short script for the play/pause controls, hover play and the cursor blink (a data attribute toggled every 500ms, stopped with the recording); no <style> block, no keyframes."
