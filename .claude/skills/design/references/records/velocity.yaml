      fontSize: 88px
      fontWeight: 800
      lineHeight: 0.9
      letterSpacing: -2.5px
    section:
      fontFamily: "Barlow Condensed"
      fontSize: 52px
      fontWeight: 800
      lineHeight: 0.94
      letterSpacing: -1.2px
    title:
      fontFamily: "Barlow Condensed"
      fontSize: 28px
      fontWeight: 700
      lineHeight: 1.05
      letterSpacing: -0.3px
    label:
      fontFamily: "Barlow Condensed"
      fontSize: 16px
      fontWeight: 600
      lineHeight: 1.1
      letterSpacing: 1.2px
      fontFeature: tnum
    action:
      fontFamily: "Barlow Condensed"
      fontSize: 19px
      fontWeight: 700
      lineHeight: 1
      letterSpacing: 0.8px
    lede:
      fontFamily: "Barlow"
      fontSize: 21px
      fontWeight: 400
      lineHeight: 1.45
      letterSpacing: 0px
