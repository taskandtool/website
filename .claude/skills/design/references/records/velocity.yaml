      letterSpacing: 0.2px
      fontFeature: tnum
  rounded:
    square: 0px
    # the website's roles: control (pressed or typed) and card (containers)
    card: "{rounded.square}"
    control: "{rounded.square}"
  spacing:
    step-xs: 8px
    step-sm: 16px
    step-md: 32px
    step-lg: 64px
    step-xl: 112px
    step-xxl: 160px
    # the website's roles: between bands, and between groups inside a band
    section: "{spacing.step-xxl}"
    lead: "{spacing.step-xl}"
  containers:
    content: 1280px
    wide: "{containers.content}"
sections:
  overview: >
    Velocity is a scoreboard, not a brochure. Three surfaces do everything:
    {colors.primary} at full saturation, {colors.white}, and {colors.black}.
    Each band of the page is one of the three, edge to edge, and the hue is
    never rationed to a button; whole sections sit on it. When a band has a
    figure, it is the largest thing on the screen, set in
    {typography.figure-xl} or {typography.figure-lg}, italic; when the band
    also has a photograph, the numeral crosses its edge. Headlines come second in size and are set in the same
    condensed black weight. Prose is short and set in Barlow, the wide sibling
    of the display face, so the two are visibly related and visibly different.
    Motion is part of the identity and is bounded to two things: one staggered
    rise per band as it enters the viewport, and a ticker that never stops,
    used only when a band holds a list of short items.
  colors: >
    {colors.primary} is the ground for at least a third of the page, always
    with {colors.white} text (7.16:1); secondary text on the hue steps down by
    size, never by a tint of the hue. {colors.white} bands carry {colors.black} prose,
    {colors.graphite} captions (10.63:1), and the hue itself as text for
    numerals (7.16:1). {colors.black} bands carry {colors.white} text and
    {colors.smoke} captions (11.0:1), a neutral grey. {colors.primary-deep} exists for the hover
    state of a filled action only. {colors.line} is the sole hairline on white.
    The hue is never placed as text on {colors.black} (2.93:1) and there is no
    grey surface anywhere; a grey band would be a fourth surface and the
    system has three.

    With the brand's own colour: a brand colour becomes the flood — whole bands, the actions, and every figure on white — so it must be a saturated mid-to-dark hue that carries {colors.white} text at 4.5:1 and whose white text still clears 4.5:1; a pale, muted or near-black brand colour cannot flood and the system keeps ultramarine.
  typography: >
    Two families from one superfamily. Barlow Condensed at 800 for every
    numeral and headline, at 700 for actions and small headings, and at 600
    for labels; Barlow at 400 for prose and 500 for captions. Numerals and the
    top-level headline are always italic: the forward lean is the system's
    signature and it is applied only where something is being asserted.
    Figures use tabular numerals. Labels are uppercase with +1.2px tracking
    because they are scoreboard captions: they sit under or beside the figure
    they name, never above a heading as decoration. Prose measure stays under
    64 characters because the reading rhythm is short bursts, not columns.
  layout: >
    A twelve-column grid at 1280px with {spacing.step-md} gutters. The type is dense and
    fast; the bands around it have room, so the loud parts land. Bands are full-bleed and alternate
    surface: flood, white, flood, white, black. The join between two bands is
    cut on a 3-degree slant once per page, on the exit from the hero, so the
    page reads as moving from the first scroll. When a band has both a figure
    and a photograph, they share a row and the numeral overlaps the
    photograph's near edge by roughly a fifth of its width. Tables are welcome and are set
    dense: {spacing.step-sm} row padding, hairline rows, tabular figures.
  elevation_and_depth: >
    None. No shadow, no blur, no translucency. Layering is expressed by
    overlap alone: a numeral crossing a photograph, a parallelogram action
    sitting across a band edge. If two things must read as stacked, let one
    physically overlap the other on the grid.
  components: >
    One radius, {rounded.square}, on everything. The characteristic shape is
    the parallelogram: filled actions and the ticker's markers are skewed by
    -12 degrees on the x axis, with their text counter-skewed to stay upright,
    and so is the head's flood block over its photograph. One band edge per
    page is skewed on the y axis by 3 degrees, and the head's flood block is a -12 degree parallelogram. Nothing else is angled; the lean means "this moves" and loses its meaning if applied
    everywhere.

    Actions are parallelograms. On white or black, the action is
    {colors.primary} with {colors.white} text and deepens to
    {colors.primary-deep} on hover in 150ms. On a flood band, the action is
    {colors.white} with {colors.primary} text and flips to {colors.black} with
    {colors.white} text on hover. When a band holds a list of short items it may
    run as the ticker: a {colors.black} strip in
    {typography.label}, uppercase, items separated by a 1px {colors.white}
    rule, scrolling continuously at about 40 pixels per second. Figures are a
    numeral in {typography.figure-xl} or {typography.figure-lg} directly above
    its {typography.label} caption, which carries the figure's source where it
    has one.
    Inputs are {colors.white} with a 2px {colors.black} border, square, and a
    {colors.primary} border on focus. Tables are {colors.black} with
    {colors.white} text and 1px {colors.graphite} row rules. Quotes are set
    in {typography.section} on {colors.black}, never in italics, because
    italics are reserved for the system's own assertions.
  dos_and_donts:
    do:
      - rule: "When a band has a figure, make the numeral the largest object on the screen, larger than the headline; when the band also has a photograph, let the numeral cross its edge."
        why: "The overlap is the identity. A number sitting politely in its own column is a stat card; a number cutting into the picture is a scoreboard over a pitch."
      - rule: "Flood whole bands with {colors.primary}; never use it as a small accent on a white page."
        why: "A single saturated hue only reads as a choice at scale. At button size it is every other blue button on the web."
      - rule: "Skew every filled action by -12 degrees and counter-skew its text."
        why: "The parallelogram is the one shape that says movement without moving; it is the system's mark and a rectangular button reads as a different product."
      - rule: "Run exactly one staggered rise per band, 80ms apart and 500ms long. When a band holds a list of short items, it may run as the ticker, at most one per page; a page without such a list has no ticker."
        why: "Motion is the identity, so it must be disciplined: a fixed budget of two kinds keeps it a signature rather than noise, a ticker with no list to carry is decoration, and both are switched off under prefers-reduced-motion."
      - rule: "Set every label in {typography.label}, uppercase, under or beside the figure it names."
        why: "Uppercase condensed captions are scoreboard grammar: they encode 'this is the unit and source of that number'. Above a heading they are decoration and the lint is right to object."
      - rule: "Alternate band surfaces and keep every band edge-to-edge."
        why: "Three flat surfaces stacked full-bleed are what make the page read as a poster; a contained column on a grey page is what every generated page does."
    dont:
      - rule: "Don't put {colors.primary} text on {colors.black}, or {colors.black} text on {colors.primary}."
        why: "Both measure under 3:1. The hue meets black only as an adjacent block, never as type on a ground."
      - rule: "Don't introduce a grey surface, a tint of the hue as a background, or a gradient."
        why: "The system has three surfaces. A fourth flattens the alternation that gives the page its rhythm, and a gradient turns a flat ink into a screen effect."
      - rule: "Don't round a corner or cast a shadow anywhere."
        why: "Speed has corners. A radius softens the parallelogram into a pill and a shadow implies floating, and nothing here floats; it overlaps."
      - rule: "Don't put more than one figure in a band, or three figures in a row."
        why: "One number per band is a claim the eye can check. A stat bar is three claims at equal volume, which is the same as none."
      - rule: "Don't italicise prose or quotes, and don't set a numeral upright."
        why: "The lean is meaning: it marks the system's own assertions. Spread to prose it becomes styling, and an upright numeral looks like a mistake beside the leaning ones."
      - rule: "Don't animate on hover beyond the colour change, and don't animate anything a second time."
        why: "The motion budget is spent on the entrance and, where there is one, the ticker. Hover choreography on cards is the template tell the entrance declaration does not cover."
  responsive_behavior: >
    Below 1024px the numeral steps from {typography.figure-xl} to
    {typography.figure-lg} and sits in normal flow above the photograph rather
    than overlapping it; {typography.display} drops to 52px with -1.2px
    tracking. Below 768px the grid is one column with {spacing.step-md} side
    margins, band padding goes from {spacing.step-xxl} to {spacing.step-xl}, tables
    scroll horizontally inside their band rather than wrapping, and the
    slanted band edge is retained at 3 degrees. The ticker keeps running at the
    same speed. Tap targets are never below 44px. Under
    prefers-reduced-motion the ticker is static and shows its first items, and
    every element that would rise in is simply present.
  known_gaps: >
    No dark theme is defined; the black bands are part of the light theme and
    a page should not be built on black alone. No second hue exists and none
    should be added for charts; if a graph is needed, use {colors.primary}
    against {colors.line} and {colors.black} and ask before adding a series
    colour. Barlow and Barlow Condensed are on Google Fonts; no self-hosted
    fallback is specified beyond system-ui. Keyframe animation is not
    available through utilities in this build, so the ticker and entrance are
    driven by the Web Animations API and class toggling from a small script.
    The band order "flood, white, flood, white, black" is a description, not a
    rule: quotes and tables both want black, so two black bands are fine as long
    as the three-surface invariants hold. Quotes set in {typography.section}
    need {typography.title} below 640px or they fall to ~14 characters a
    line.

