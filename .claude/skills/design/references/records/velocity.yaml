# Kinetic. One hue at full saturation flooding whole bands, numerals larger than
# the headline, a forward lean on everything that moves, and a scoreboard
# ticker when a band holds a list of short items. The loudest system in the roster, for gyms,
# boxing, martial arts and sports: the hero is an action photograph cut by a diagonal flood block.
id: velocity
title: Velocity
summary: >
  A kinetic single-hue system: ultramarine flooding whole bands against white
  and true black, condensed black-weight numerals set larger than the headline
  and overlapping a photograph where a band has both, parallelogram actions, and a
  scoreboard ticker for a list of short items. Dense, fast, and built to be read at a glance.
tokens:
  colors:
    primary: "#2230FF"
    primary-deep: "#0E14A8"
    smoke: "#B9BBC9"
    white: "#FFFFFF"
    black: "#000000"
    graphite: "#3B3D52"
    line: "#D7D9E6"
    # the website's colour roles (styles/input.css, the layout and the shared components read these)
    canvas: "{colors.white}"
    surface: "{colors.white}"
    panel: "{colors.primary}"
    night: "{colors.black}"
    ink: "{colors.black}"
    ink-2: "{colors.graphite}"
    ink-3: "{colors.graphite}"
    night-ink: "{colors.white}"
    night-ink-2: "{colors.smoke}"
    accent: "{colors.primary}"
    accent-ink: "{colors.white}"
    accent-hover: "{colors.primary-deep}"
    line-strong: "{colors.graphite}"
    line-on-night: "{colors.graphite}"
  typography:
