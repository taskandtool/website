# The website's lint hints this system uses on purpose (scripts/lint.mjs).
x_declares:
  - entrance-everywhere
x_declares_reasons:
  entrance-everywhere: >
    Motion is this system's identity, not a flourish. Each band's contents rise in once, 80ms apart
    over 500ms, as the band enters the viewport. It is declared because the lint rightly treats
    entrance animation as a template default; here it is bounded (one moment per band, nothing on
    hover, nothing repeated) and it is switched off under prefers-reduced-motion in both the CSS
    variants and the script.

# ── Extensions ────────────────────────────────────────────────────
x_invariants:
  style:
    - "Three surfaces only: {colors.primary}, {colors.white}, {colors.black}. No grey, tint or gradient ground."
    - "Every band is full-bleed and at least a third of the page sits on {colors.primary}."
    - "When a band has a figure, it is the largest object on the screen, in the condensed 800 italic; when the band also has a photograph, the numeral overlaps it at desktop width."
    - "Filled actions are parallelograms (-12 degrees x-skew). No radius and no shadow anywhere."
    - "Motion budget: one staggered rise per band, plus at most one ticker when a band holds a list of short items. Nothing else moves."
  accessible:
    - "{colors.primary} text is never on {colors.black} and {colors.black} text is never on {colors.primary} (both under 3:1)."
    - "Text on {colors.primary} is {colors.white} (7.16:1), stepping down by size, never by tint; secondary text on {colors.black} is {colors.smoke} (11.0:1); on {colors.white} never lighter than {colors.graphite} (10.63:1)."
    - "Both kinds of motion are disabled under prefers-reduced-motion, in CSS variants and in the script."
    - "Tap targets >= 44x44px at every breakpoint; focus is a 4px {colors.white} or {colors.black} outline offset from the control."

x_motion:
  principle: "One staggered rise per band and one signature, the ticker. Nothing else moves: hover is a colour change only, and nothing animates a second time."
  entrance: "On load, the head's headline, lead, figure and action each rise 24px and fade in from transparent over 500ms on cubic-bezier(.2,.7,.2,1), 80ms apart."
  signature: "The scoreboard ticker: when a band holds a list of short items, a {colors.black} strip of {typography.label} uppercase items split by 1px {colors.white} rules runs left at about 40px per second, forever, at most one per page (in the reference, directly under the head)."
  scroll: "Every band's contents arrive once with the same rise, 24px over 500ms, 80ms apart in reading order, when 15% of the band enters the viewport; the ticker keeps running. Nothing else arrives on scroll."
  reduced: "Under prefers-reduced-motion nothing moves and nothing is hidden: no element rises in, and the ticker stands still showing its first items; with script off the page is complete."
  mechanism: "CSS only: the template's data-rise (the first screen) and data-reveal (a later band) in styles/input.css; the ticker is a data-marquee row (its list twice, as ReviewsSection does), still under reduced motion. Hover colour changes use transition-colors."

x_imagery:
  role: >
    Evidence cut hard. A photograph shares a row with its band's figure when
    the band has one, and carries nothing on it except the overlapping
    numeral.
  density: "at most one photograph per band where supplied, beside that band's figure when it has one; never two adjacent images unless they are a deliberate pair at unequal sizes"
  treatment: >
    Hard-cropped, square-cornered, no overlay, no scrim, no filter, no border.
    Images are cropped wide (3:1 or 16:9) or square, never 4:3, and are sized
    to the grid so the numeral can overlap one edge by roughly a fifth of its
    width. The overlap, and the head's solid flood block over the photograph's free side, are the only things ever placed on a photograph; the subject is never covered and never tinted.
  aspect_ratios: ["3/1", "16/9", "1/1"]
  caption: >
    A caption sits below the image, never on it, in {typography.caption} in
    {colors.graphite} on white or {colors.white} on the hue, {colors.smoke} on black. Its words
    come from the brand folder (see standards/copy.md).
  forbidden:
    - "text or headings on a photograph itself: words sit on the head's solid flood block, and the numeral overlapping an edge is the one thing on the image"
    - "rounded corners, borders or shadows on an image"
    - "duotone, colour wash, blur or any tint of the hue over an image"
    - "a photograph used as a full-bleed background behind prose"
    - "a gallery grid of equal thumbnails"
  no_assets_supplied: >
    If the brief supplies no images, do NOT invent placeholder <img> paths. Let
    the numerals carry the row on their own at full size, each with its label
    caption beneath; no empty frame is drawn.

# How this system emphasises ONE figure. The renderer reads this; it must never
# hardcode a token name, because tokens are per-system.
x_emphasis:
  device: "a `text-figure-xl` italic numeral in `text-white` on the `bg-primary` hero band, overlapping the hero photograph's edge when there is one"
  applies_to: "at most one statistic per page; every other figure is `text-figure-lg` in its own band"
  why: "The hero numeral is the loudest object on the page; a second at the same size makes both a stat row."

# How any band of any page is laid out. Look only: the page type picks the bands
# and the mode, the brief fills them, this says how each shape sits on the board.
x_layout:
  measure:
    reading: "56–64ch — {typography.lede} on {colors.primary} or {colors.black}, {typography.copy} on {colors.white}; running text past three paragraphs is {typography.copy} on white"
    caption: "under 48ch, {typography.caption} ({typography.label} when it names a figure)"
  grid:
    columns: 12
    container: "bands full-bleed; content 1280px inside, 48px side padding, 20px below 768px"
    gutter: "{spacing.step-md}"
    text_columns: "4–7 columns for text; a headline may take 8"
    media_columns: "7, 8 or 12 columns, hard-cropped to 3/1, 16/9 or 1/1; a square takes 4 or 5"
  rhythm:
    section: "{spacing.step-xxl} → {spacing.step-xl} band padding"
    group: "{spacing.step-xl} → {spacing.step-lg}"
    item: "{spacing.step-md}"
    element: "{spacing.step-sm}"
    separator: "surface — each band changes ground among {colors.primary}, {colors.white} and {colors.black}, edge to edge; inside a band, rows split on a 1px rule ({colors.line} on white, {colors.white} on flood, {colors.graphite} on black); one band edge per page is cut at 3 degrees"
  registers:
    persuasion: { head: statement, type: "{typography.display} italic head, {typography.figure-xl} for the page's one figure, {typography.figure-lg} for one figure per band, {typography.section} band headings, {typography.lede}", rhythm: "{spacing.step-xxl} band padding; surfaces alternate; a figure crosses its band's photograph; the slanted edge on the exit from the head; the rise on every band" }
    retrieval: { head: plain, type: "{typography.section} title, {typography.title} group heads and row names, {typography.copy} rows, {typography.label} keys and table heads", rhythm: "one step denser: {spacing.step-xl} band padding, {spacing.step-sm} rows; fewer, longer bands — tables on black, facts on white; a figure only where a number is the answer; no overlap, no slant" }
    reading: { head: plain, type: "{typography.section} title, {typography.copy} at measure.reading on white, {typography.title} subheads, {typography.caption} for sources", rhythm: "one white band, one column at measure.reading from column 1; a photograph the text refers to breaks out to 8 columns; the rise on the head band only, no ticker" }
  head:
    statement: "Full viewport width, at least 720px tall (80vh on a phone): one action photograph, the sharpest the brand has at 1600px or wider, of a person mid-effort (a punch, a lift, a sprint) with the subject on one side of the frame and the other side free (brand/images.md gives the focal point), object-cover, square edges, no filter. Over the free side, a solid {colors.primary} block, no fade and no transparency, covering about 45% of the width and running off the edge, its inner edge a steep diagonal (a skew-x-12 parallelogram, the content inside un-skewed), so the subject is never covered. On the block: the headline in {typography.display} {colors.white} italic uppercase, four lines at most ({typography.section} below 1024px), the lead in {typography.lede} {colors.white}, then the parallelogram action in white with {colors.primary} text. The one figure (an offer's price, a count) may cross the block's diagonal onto the photograph in {typography.figure-xl} {colors.white}. A ticker band on {colors.black} runs directly under the head when the brief gives short items. With the subject centred, the block becomes a diagonal band across the lower third instead. No action photograph: a {colors.primary} band with the headline in {typography.display} {colors.white} italic uppercase on 8 columns and the lead and action on the 4 beside it, and the one figure alone at {typography.figure-xl} beside the headline, the band exiting through the 3-degree slant."
    plain: "A {colors.primary} band at {spacing.step-xl} padding: the title in {typography.section} uppercase (italic only when it asserts), one lead line in {typography.lede} in {colors.white} across 7 columns, and at most the one inverse action; no photograph, no figure, no slant. The next band, holding what the reader came for, starts on the first screen."
  close: "A {colors.primary} band, edge to edge, left-aligned on the 12 columns, padding {spacing.step-xxl} ({spacing.step-xl} below 1024px). Columns 1–5: the heading in {typography.section} {colors.white} uppercase, upright, a {typography.lede} {colors.white} passage {spacing.step-sm} below, the contact facts {spacing.step-md} below that as a definition grid under 1px {colors.white} rules (keys in {typography.label} uppercase, values in {typography.copy} as underlined links), then the white parallelogram action with {colors.primary} text in {typography.action} {spacing.step-md} beneath. Columns 6–12: one 16/9 photograph aligned to the band's bottom, caption below it in {typography.caption} {colors.white}. It is the last band; nothing follows it."
  shapes:
    items:
      as: "stack of numbered hairline rows beside a heading (sidebar), or the ticker"
      look: "index in {typography.label}, name in {typography.title} uppercase, its line in {typography.copy} beside or beneath; a 1px rule between rows"
      counts: "1: fold into prose. 2–3: a switcher of 2–3 columns, each with name and line, 1px rule above. 4–10: numbered rows on 8 columns beside a 4-column heading or the band's one photograph. 11+ names without lines: a cluster of 3 columns of hairline rows at 12. 5+ items under about six words each may instead run as the ticker, single-line and unwrapped, at most one per page."
    table:
      as: "table on a {colors.black} band, scrolling horizontally below 768px"
      look: "heads in {typography.label} uppercase in {colors.smoke} over a 1px {colors.white} rule; rows in {typography.copy} in {colors.white} at {spacing.step-sm} padding with 1px {colors.graphite} rules; row names in {typography.title} uppercase; figures tabular"
      counts: "1–3 rows: facts instead. Up to 4 columns: 8 columns beside a 4-column figure, photograph or form. 5+ columns: 12. Any number of rows stays one table; never split into cards."
    facts:
      as: "a two-column definition grid under a 1px rule"
      look: "key in {typography.label} uppercase ({colors.graphite} on white, {colors.white} on flood, {colors.smoke} on black), value in {typography.copy}, tabular"
      counts: "1–4: 6 columns beside prose or the band's figure. 5–10: 12 columns as two key/value grids side by side. A run of same-shaped values (seven days, several prices) is a table on black instead."
    qa:
      as: "stack of hairline rows"
      look: "question in {typography.title} uppercase, answer in {typography.copy} at measure.reading beneath at {spacing.step-sm}; 1px rule between pairs"
      counts: "1–6: rows on 8 columns. 7–14: rows split 4/8, question left. 15+: the same, grouped under a {typography.section} subhead per group the brief names, groups on alternating white and black bands."
    people:
      as: "one row per person (sidebar), or a hairline list"
      look: "portrait at 1/1 hard-cropped, name in {typography.title} uppercase, role in {typography.label}; portraits never sit side by side at equal size"
      counts: "1–3: a row per person, the portrait on 4 or 5 columns and the name, role and passage beside it, the portrait's side alternating row to row. 4+: a hairline list of name and role in 2 or 3 columns, beside one lead portrait on 5 when the brief gives one. No portraits: the list alone."
    sequence:
      as: "stack of numbered hairline rows"
      look: "the step number in {typography.label}, the step's name in {typography.title} uppercase, its line in {typography.copy}; 1px rules between"
      counts: "2–6: rows on 8 columns. 3–4 steps of under about eight words: a switcher across 12, a 1px rule between. 7+: rows at 12, split 4/8. Dated entries with more than one fact each: a table on black."
    media_text:
      as: "sidebar, 7/5"
      look: "the photograph on 7 at 16/9, caption below it; text on 5 bottom-aligned; when the band has a figure, it sits on the 5 and crosses the photograph's near edge"
      counts: "1: 7/5. Several: the photograph flips side band to band and the surface alternates. A 1/1 photograph takes 5, with text on 7. Below 1024px the figure sits in flow above the photograph."
    gallery:
      as: "stack of full-width images and unequal overlapping pairs — never a grid"
      look: "hard-cropped, no border, caption below each in {typography.caption}; in a pair, the smaller image overlaps the larger's lower corner, the only layering the system has"
      counts: "1: 12 columns at 3/1 or 16/9. 2: an unequal pair — the first at 12 and 16/9, the second on 7 columns offset to the right and overlapping its lower edge by {spacing.step-xl}. 3: the pair, then one at 12 and 3/1. 4: two pairs, the smaller image on the right then the left. 5–8: pairs in turn, an odd last image at 12 and 3/1. 9+: the same, split across two bands of different surface. Never equal thumbnails side by side."
    quote:
      as: "reviews on a {colors.white} band; one pull quote may be a {colors.black} block"
      look: "each review a {colors.white} block with a 2px {colors.black} top rule, square: the platform's square mark in colour (24px) and the review's stars as star graphics on one line, the quote in {typography.title} upright, the name and date in {typography.caption} {colors.graphite}. A single pull quote (the club's own words) may sit in a {colors.black} block in {typography.section} uppercase, attribution in {colors.smoke}"
      counts: "1: one block across the container. 2–3: blocks on 8 columns, staggered left then right, {spacing.step-lg} apart. 4+: the longest at {typography.section}, the rest at {typography.title} in a 6/6 stack. Any quote over about 50 words sets at {typography.title}."
    prose:
      as: "sidebar or a single column at measure.reading"
      look: "{typography.lede} on flood or black, {typography.copy} on white, never italic; paragraphs {spacing.step-md} apart"
      counts: "1–2 paragraphs: 7 columns beside a 5-column heading. 3+: a white band, one column at measure.reading."
    form:
      as: "stack of fields"
      look: "labels in {typography.label} uppercase, inputs {colors.white} with a 2px {colors.black} border, {rounded.square}, min 44px, a {colors.primary} border on focus; the submit is the parallelogram action"
      counts: "1–3 fields: a 4-column stack beside an 8-column table or photograph. 4–8: 6 columns, short fields two-up. 9+: 8 columns, fields two-up, long text at full width."
    index:
      as: "stack of hairline rows, each one link"
      look: "title in {typography.title} uppercase, its line in {typography.copy}, the whole row the hit area with a colour change only on hover; a date in {typography.label}"
      counts: "1–6: rows on 8 columns. 7+: rows at 12 in two columns split at the midpoint. With images: each row a 1/1 image on 3 columns beside its text, images stacked down the page, never side by side."
  focal: "A band with a figure leads with it, larger than its headline; without one the headline leads in {typography.section}; then the photograph, then prose, then labels. One lead per band, and at most one figure."
  never:
    - "Sit a figure politely in its own column when its band has a photograph — it crosses the photograph's edge."
    - "Run a ticker because the system has one — only a list of short items runs as a ticker, and its items never wrap to two lines."
    - "Put two photographs side by side at equal size, or a grid of equal thumbnails."
    - "Contain a band as a box on a grey or tinted page — every band is full-bleed."
    - "Cut more than one band edge on the slant."
    - "Put a figure or a photograph in a plain head."
    - "Keep the overlap below 1024px — the figure drops into flow above the photograph."
