# Vesper: the chair after dark. Midnight, warm gold and one frosted booking bar, for places people
# go after work: barbershops, grooming, tattoo studios, cocktail bars. Reworked 2026-09-24 from a
# generic "luxury travel" glass system: glass is now the booking bar and the nav only, cool light
# bands relieve the midnight, and the hero is the shop's own moody photograph (APX Barber Co).
id: vesper
title: Vesper
summary: >
  A midnight system for places people go after dark: a moody full-bleed photograph under an
  even midnight wash, a centred high-contrast serif, one frosted booking bar, warm gold reserved
  for the action, and cool light bands for reviews and prices.
tokens:
  colors:
    primary: "#D8A857"
    midnight: "#0B1020"
    abyss: "#060A16"
    veil: "#1A2136"
    veil-high: "#252E47"
    pearl: "#F4F1E8"
    pearl-dim: "#C3C7D4"
    pearl-faint: "#9AA1B4"
    mist: "#EEF1F6"
    slate: "#4A5168"
    primary-deep: "#8A6520"
    ember: "#E0714A"
    sage: "#7FA893"
    # the website's colour roles (styles/input.css, the layout and the shared components read these)
    canvas: "{colors.midnight}"
    surface: "{colors.veil}"
    panel: "{colors.veil}"
    night: "{colors.abyss}"
    ink: "{colors.pearl}"
    ink-2: "{colors.pearl-dim}"
    ink-3: "{colors.pearl-faint}"
    night-ink: "{colors.pearl}"
    night-ink-2: "{colors.pearl-dim}"
    accent: "{colors.primary}"
    accent-ink: "{colors.midnight}"
    accent-hover: "{colors.primary-deep}"
    line: "rgb(244 241 232 / 0.16)"
    line-strong: "rgb(244 241 232 / 0.32)"
    line-on-night: "rgb(244 241 232 / 0.16)"
  typography:
    display:
      fontFamily: "Playfair Display"
      fontSize: 84px
      fontWeight: 400
      lineHeight: 1.0
      letterSpacing: -2.2px
    section:
      fontFamily: "Playfair Display"
      fontSize: 52px
      fontWeight: 400
      lineHeight: 1.1
      letterSpacing: -1.2px
    title:
      fontFamily: "Playfair Display"
      fontSize: 30px
      fontWeight: 400
      lineHeight: 1.25
      letterSpacing: -0.3px
    lede:
      fontFamily: "Inter"
      fontSize: 18px
      fontWeight: 300
      lineHeight: 1.7
      letterSpacing: 0.1px
    copy:
      fontFamily: "Inter"
      fontSize: 18px
      fontWeight: 300
      lineHeight: 1.7
      letterSpacing: 0.1px
    figure:
      fontFamily: "Playfair Display"
      fontSize: 44px
      fontWeight: 400
      lineHeight: 1.0
      letterSpacing: -0.6px
      fontFeature: tnum
    caption:
      fontFamily: "Inter"
      fontSize: 15px
      fontWeight: 400
      lineHeight: 1.5
      letterSpacing: 0.4px
    # label: the website's role, set the same as caption in this system
    label:
      fontFamily: Inter
      fontSize: 15px
      fontWeight: 400
      lineHeight: 1.5
      letterSpacing: 0.4px
  rounded:
    panel: 24px
    pill: 9999px
    soft: 12px
    # the website's roles: control (pressed or typed) and card (containers)
    card: "{rounded.panel}"
    control: "{rounded.pill}"
  spacing:
    step-xs: 6px
    step-sm: 12px
    step-md: 24px
    step-lg: 48px
    step-xl: 88px
    step-xxl: 144px
    # the website's roles: between bands, and between groups inside a band
    section: "{spacing.step-xxl}"
    lead: "{spacing.step-lg}"
  containers:
    content: 1200px
    wide: "{containers.content}"
sections:
  overview: >
    Vesper is a room after dark with the lights low. The head is the shop's own photograph under
    an even {colors.midnight} wash; the ground is {colors.midnight}, and cards on it are solid
    {colors.veil} panels at 24px with a one-pixel lit top edge. Frosted glass (a backdrop blur) is
    kept for two things only: the booking bar in the head and the floating nav. Cool
    {colors.mist} bands relieve the dark and carry what is read closely: reviews, prices, facts. Type pairs a
    high-contrast display serif with a light-weight sans; the serif carries all
    headings and every number, the sans carries all prose. {colors.primary}
    (gold) is the warm colour and appears once per band, on that band's
    action; where a band sets several options side by side as cards, once per
    card. Numbers are set in the serif in {colors.pearl} on dark or {colors.midnight} on light,
    never gold. {colors.sage} may mark a trust badge; {colors.ember} marks only a date that
    expires (an offer's end), and never as text.
  colors: >
    Three depths of dark do the structural work: {colors.abyss} for the footer,
    {colors.midnight} for the page ground, {colors.veil} and {colors.veil-high} for panels. On
    dark, text runs {colors.pearl} for headings, {colors.pearl-dim} for prose, {colors.pearl-faint}
    for captions. {colors.mist} is the light band, cool and never beige, with {colors.midnight}
    text (16.7:1) and {colors.slate} for secondary lines (7.0:1); dark and light bands alternate,
    and no more than two dark bands run together. Gold is an action colour, never a text colour at body size, with
    the single exception of a standalone figure.

    With the brand's own colour: a brand colour light enough to carry {colors.midnight} text at 4.5:1 (and to show at 3:1 as a focus ring on {colors.veil}) takes the action, with {colors.primary-deep} following as the hover under {colors.pearl} text; a mid or dark brand colour fails here (the green #2F804F gives 3.9:1 under {colors.midnight}), so use a lighter tint the brand notes record, or take no accent.
  typography: >
    Playfair Display at 400 for every heading and every number; Inter at 300
    for prose and at 400 for captions. Display sizes take heavy negative
    tracking (-2.2px at 84px). Captions take positive tracking (+0.4px) — the
    only place letter-spacing opens up. Prose measure stays under 68 characters.
  layout: >
    A centred 1200px column. Bands alternate {colors.midnight} and {colors.mist} full width,
    separated by generous vertical space ({spacing.step-xxl} at desktop) and the change of ground,
    never by rules. On dark bands, content cards are solid panels; headings sit on the ground.
    The hero is full-bleed with the nav floating over it on a frosted panel.
  elevation_and_depth: >
    Depth comes from the photograph and from three dark steps. Panels on dark are solid with a
    one-pixel top edge in {colors.pearl} at 12% opacity to read as a lit rim; only the head's
    booking bar and the nav carry a backdrop blur (about 72% opacity), because they sit over the
    photograph. Shadows are large,
    soft and very dark — never grey. Three depth steps only: ground, panel,
    raised panel.
  components: >
    Generous and consistent: {rounded.panel} (24px) for every panel and card,
    {rounded.soft} (12px) for inline chips and inputs, {rounded.pill} for
    buttons and badges. The full-bleed hero and the bands meet the viewport edge square; everything inside a band is rounded.

    Buttons are pills. Primary is a {colors.primary} fill with
    {colors.midnight} text; on hover it deepens to {colors.primary-deep} with
    {colors.pearl} text. Secondary is {colors.veil-high} with no border. Cards
    on dark are solid {colors.veil} panels; on {colors.mist} they sit straight on the band, split by space. Inputs are {colors.veil} at {rounded.soft} with no visible
    border until focus, which brings a {colors.primary} ring.
  dos_and_donts:
    do:
      - rule: "Use {colors.primary} once per band, on that band's action; where a band sets options side by side as cards, once per card, on each card's action."
        why: "Gold is the system's only warm note; two gold things in one panel halve the value of both, while one per card still reads as one instruction per choice."
      - rule: "Keep frosted glass to the head's booking bar and the nav; set cards on dark as solid panels with a lit top edge, and put reviews, prices and facts on {colors.mist} bands."
        why: "Glass everywhere is the generated-page default and costs contrast; one frosted bar over the photograph is the signature, and the light bands let marks, stars and prices read."
      - rule: "Set every number in {typography.figure} or {typography.section}, in the serif."
        why: "The serif numerals are what make the system read as considered rather than technical."
      - rule: "Orchestrate one entrance sequence on page load, staggered by 120ms."
        why: "A single arrival reads as choreography; the same effect on every section reads as a template."
    dont:
      - rule: "Don't use a grey shadow. Shadows are {colors.abyss} at low opacity."
        why: "Grey shadows on a dark ground read as haze and flatten the layering the system depends on."
      - rule: "Don't set body prose in the display serif, or headings in the sans."
        why: "The split is absolute; blurring it removes the only typographic signal the system has."
      - rule: "Don't introduce a fourth depth step."
        why: "Ground, panel, raised. A fourth makes the stack unreadable because the blur already costs contrast."
      - rule: "Don't use {colors.primary} for body text, or for more than one element in a band or card."
        why: "It is an instruction, not a decoration."
      - rule: "Don't square off a corner anywhere."
        why: "A single square element reads as a mistake against 24px panels, not as contrast."
  responsive_behavior: >
    Below 768px the column is full width with {spacing.step-md} side margins,
    {typography.display} drops to 46px with -1.2px tracking, and section
    spacing goes from {spacing.step-xxl} to {spacing.step-lg}. Panels keep their radius. The booking bar's blur drops to 12px to protect scroll performance,
    and on a phone the bar sits under the photograph, full width.
    Tap targets never below 44px.
  known_gaps: >
    Panel colours are declared as opaque. The booking bar and the nav are the two frosted
    elements, rendered at about 72% opacity with a backdrop blur over the photograph; their
    declared {colors.veil} is the composited equivalent for contrast checking. There is no all-light theme; {colors.mist} is a band, never the whole page. No
    data-visualisation palette is defined. Playfair Display and Inter are both
    on Google Fonts.

